# Every test in the `e2e` and `note` binaries drives a tree of real processes —
# the `onepipeline` binary, the two sibling doubles it runs as subprocesses, and
# the round owner one of those starts. Its true concurrency is therefore process
# trees, not threads, and letting nextest run one per core oversubscribes the
# machine badly enough that a test times out waiting for work that is merely
# queued behind other tests' work.
#
# The cap is a statement about what these tests *are*, not a way to make a slow
# test pass: each one still runs in under a second on an idle host.
#
# One group across both binaries rather than one each. The limit is what the
# machine can hold, not what a binary may ask for, so two groups of eight would be
# sixteen process trees at once — the oversubscription this exists to prevent.
# Measured: uncapped, the note journeys ran 20.6s where the capped e2e binary runs
# them in 15.8s of CPU.
#
# llmlint: ignore-block[comments_earn_their_place] this number sets the e2e tier's
# wall time on every host — the tier is its test-time over it — so the runs that
# moved it, and the value tried above it that failed, are the only things that say
# whether 8 is measured or liked. Neither is recoverable from the key below.
#
# 8 is a ceiling, not a target: nextest's global thread count is the host's cores
# unless a run passes `--test-threads`, and nothing here or in CI does, so on the
# 4-core Windows runner, and on any runner with fewer than 8 cores, the global
# count binds first and the group runs one tree per core, as it did at 4.
# `tests/nextest_runs.rs` drives this file at four test threads and holds it there.
# Where an earlier note said 8 failed
# `dispatch::the_run_state_this_crate_places_is_where_the_sibling_looks_for_it` on
# four pinned cores, that was 8 trees on 4 cores, which this setting never asks.
#
# Measured on this 14-core host, the whole plain e2e tier on 96e27397's tree
# (2026-11-21, mean 1-minute load 2.6-4.4): 4 ran 1770.0s, every journey passing;
# 8 ran 1099.7s, every journey passing; one per core (`"num-cpus"`, 14 here) ran
# 820.4s and 838.7s and failed a different race each time —
# `human_items_expiry::a_drivers_sweep_releases_its_own_human_step_and_another_runs`,
# `store::a_retried_project_launches_again_reading_the_lineage_head_under_the_roots_id`,
# `driver::a_stop_waits_out_an_observer_restart_under_way_and_ends_what_it_started` —
# which is the first paragraph above happening. CPU barely moved (1018s at 4, 1046s
# at 8): the tier is waits, and the cap decides how many of them overlap.
[test-groups]
e2e = { max-threads = 8 }
# llmlint: ignore-end[comments_earn_their_place]

[profile.default]
# llmlint: ignore-block[comments_earn_their_place] the run number, test count, and
# elapsed time below are not history: they are the measurement that sets both bounds
# on the line beneath them. `period` has to sit above what a test here costs and
# under `waited()`'s deadline, and `terminate-after` above that whole suite and the
# hook's ceiling — so a reader who cannot see what a run of this suite actually
# costs cannot tell a bound that was measured from one somebody liked, and the next
# person to move either has nothing to move it against.
# A test that blocks names itself, and is then ended. Without this it produces no
# output and no failure — it simply stops, and only the CI job's own limit ends it.
#
# `period` sits between what a test here costs (the macOS leg of run 32538759791
# was 731 tests in 270.422s) and the 120-second deadline `waited()` in
# `tests/e2e/harness.rs` gives every poll, so the first `SLOW` line lands while
# the stuck journey's own deadline is still running.
#
# `terminate-after` is 6 periods — 360s — above both that whole suite and the
# 300-second ceiling the `pre-push` hook waits under (`tests/e2e/hook.sh`,
# `hook.bat`), so a held push reaches its own refusal, which names the rendezvous
# nothing wrote, rather than being cut off by the runner, which can only name the
# test.
slow-timeout = { period = "60s", terminate-after = 6 }
# llmlint: ignore-end[comments_earn_their_place]
# `fail` — what the recipes used to pass on the command line — suppresses the
# `SLOW` lines above along with the passes, which would leave a hanging test
# unnamed until the runner ended it. `slow` is the same silence about successes
# with the one report a hang produces kept.
status-level = "slow"

# The examples the build compiled beside the suite. `tests/human_items.rs` runs
# the documented schema exporter's own executable rather than compiling it while
# the test runs, and nextest archives only the package's binaries unless told, so
# a re-run from the archive would otherwise not find it.
[profile.default.archive]
include = [{ path = "debug/examples", relative-to = "target", depth = 1 }]

# What CI's cross-platform legs run under, and the only difference is that every
# test reports as it finishes.
#
# On a terminal nextest already names the running tests in its progress bar, so a
# developer loses nothing by the default above. CI has no terminal and no bar, so
# with successes silent a 237-minute run and a 3-second one produce byte-identical
# logs up to the last line. A line per test is what makes a cancelled or timed-out
# leg say how far it got: the last line names where it stopped.
[profile.ci]
status-level = "pass"
# Every test runs whatever another failed: the cross-platform jobs each run the
# whole suite once, for hours, so a first failure that cancelled the rest left
# the failures behind it for another whole run to find (run 41259782580's
# Windows leg stopped one failure in, with 1,053 of 1,665 e2e tests unrun).
fail-fast = false
# A test that returns while a process it started still holds its output fails,
# naming itself, rather than passing as `LEAK`: `crates/testfakes/src/
# containment.rs` says why such a process holds the leg. 100ms is nextest's
# default: a world's teardown has already waited for what it ended, so anything
# still holding the output past it is a leak rather than a slow exit.
leak-timeout = { period = "100ms", result = "fail" }

# llmlint: ignore-block[comments_earn_their_place] the run and the timings below
# are the measurement that sets the one number on the line beneath them, and the
# next person to move it has nothing else to move it against.
# One journey gets ten periods, 600s, on the cross-platform legs instead of six.
# On the Windows leg it takes 150-250s even alone, so under the whole suite's load
# it crossed 360s twice in run 38675577984 and fail-fast threw away the leg. Its
# cost is real work, not a hang: on Linux, at a load average of 30-60, the
# harness's teardown spent 52-206ms of a 86-129s run, and the test ran no slower
# than on d8d674f1, before the teardown existed (median 103s against 122s, five
# interleaved pairs).
# A profile's own overrides are read before `default`'s, so this one takes effect
# and the test still joins the `e2e` group below. `tests/nextest_runs.rs` holds
# this override and checks that no other test's limit moves.
[[profile.ci.overrides]]
filter = 'binary(e2e) and test(=readjust::the_store_is_written_only_for_what_its_projection_holds_changed)'
slow-timeout = { period = "60s", terminate-after = 10 }
# llmlint: ignore-end[comments_earn_their_place]

# llmlint: ignore-block[comments_earn_their_place] the image versions, medians and
# runs below are the measurement that sets the one number beneath them, and the
# next person to move it has nothing else to move it against.
# On Windows every other test gets nine periods, 540s, instead of six. That is the
# runner image, not this suite. On windows-2025-vs2026 20261007.264.1, tests over
# 20s on main ran 1.30-1.42x (median per test) their time on 20260925.250.1, where
# three runs measured 0.76-1.02x. Tests under 5s did not slow down. On the new
# image, run 38720831977 (c65e9a8b) timed out
# `out_of_band::a_run_whose_records_cannot_be_read_leaves_no_owner_known_to_be_unique`
# at 360s; that test had taken 279-293s on the old image. 540s is 360s times
# that factor, with room. After the override above, because the first matching
# override wins per setting, so the store journey keeps its ten periods here too.
# `tests/nextest_runs.rs` holds both, and holds Linux and macOS at six.
[[profile.ci.overrides]]
platform = 'cfg(windows)'
slow-timeout = { period = "60s", terminate-after = 9 }
# llmlint: ignore-end[comments_earn_their_place]

# The two host-sized journeys take the **whole** group while they run.
#
# Each assembles four hundred run roots and grows their journals to ten gibibytes,
# so its true cost is the disk rather than a process tree — which is why the cap
# above, about process trees, does not already cover it. The `host_view`
# journey the name also matches takes it for a second reason: it times single
# `onepipeline host` reads by this suite's build, recorded beside the
# `host-view-time` budget, and a read sharing the machine with other tests would
# time the sharing. Sharing a run with them
# broke two things that measure time: `listing`'s own growth ratio, and
# `views::status_keeps_the_last_placeable_beat_when_the_clock_stops_being_readable`,
# which read a heartbeat three seconds stale because a saturated disk delayed the
# process writing it.
#
# Spelled as the threads a test **requires** rather than as a group of its own, so
# these journeys stay inside the cap above rather than running beside it: a second
# group would be process trees beyond it, which is the oversubscription that cap
# exists to prevent. nextest names a key it does not know and says nothing about
# this one, which is how a setting that silently did nothing would be caught.
#
# **Before the group assignment below**, because the first matching override wins
# per setting and the one below matches every test in these binaries.
#
# Every override that asks for more than one thread also sets `priority`, so these
# tests are scheduled before every one-thread test in the group. Without that
# ordering nextest can end a run with tests silently unrun: its scheduler
# (`future-queue` 0.4.0, `FutureQueueGrouped::poll_pop_in_progress`) re-reads a
# group's queue only when a member *of that group* finishes. A queued whole-group
# test that does not fit when the group's last running member ends then waits
# for a wake-up that never comes, because the global slots it needs are held by
# tests outside the group. The run ends with `warning: N/M tests were not run`,
# no reason, and exit 100. That is the macOS leg of run 36876601588, job
# 110417653725, which stopped at 1097 of 2247. Scheduled first, a test that needs
# the whole group only ever waits behind another such test, and that test frees
# as much as it needs. `tests/nextest_runs.rs` drives this file through nextest
# under that condition and holds it.
[[profile.default.overrides]]
filter = 'test(/a_host_sized/)'
threads-required = 8
priority = 100

# The four journeys that hold a loop's pass **rate** to a floor take the whole
# group as well. Each counts passes across a wall-clock window, so anything else
# sharing the machine then lowers the count, and the journey cannot tell that from
# a slower loop. On the 4-core Windows leg, 4 is the whole runner: run 36158473768
# failed the `adoption` one at 26 chatty passes in 60s against 119 quiet, while it
# shared the leg with `summary::tests`' CPU-bound folds. Those ran 1.4-1.6x their
# time on main's passing leg, and every `adoption` journey ran faster than it did
# there. `maintenance::the_rate_journeys_take_the_whole_group` holds this in place.
#
# Taking the whole group is also what keeps every other journey out of their
# windows, `maintenance`'s drivers, slots and `git` work among them, so those
# share the group at one thread. Each maintenance journey counts passes by event
# rather than across a window, and its one wall-clock bound is a ceiling every
# journey here lives under; at one thread they ran clean at 4 and at 8 above, and
# their 70s alone is no longer a stretch of the tier with one test running.
# `maintenance::the_maintenance_journeys_never_share_a_whole_group_journeys_run`
# holds this, and `tests/nextest_runs.rs` shows it by real scheduling.
[[profile.default.overrides]]
filter = 'binary(e2e) and (test(=adoption::a_held_release_is_asked_about_on_its_own_interval_however_fast_the_loop_runs) or test(=loopcost::a_converged_run_does_no_scheduling_work_while_it_records_nothing) or test(=loopcost::an_idle_pass_does_not_grow_with_the_run_it_is_idling_on) or test(=loopcost::another_runs_ledger_is_read_on_its_own_interval_and_not_on_the_loops))'
threads-required = 8
priority = 100

# llmlint: ignore-block[comments_earn_their_place] the jobs, times and counts below
# are the measurement that decides this journey needs the whole group, and the next
# person to move it has nothing else to move it against.
# The busy review round takes the whole group too, because its cost is process
# starts and they are what every other journey's tree competes for. Its four drivers
# (`start --attach`, two `adopt`s, `readjust`) start ~13,000 `git` processes over the
# round, 31-61 a second each for its whole life, counted with the journey's own
# counting `git` on Linux; a `git` start costs some twenty times as much on the
# Windows runner. Alone on windows-2025-vs2026 it ran 292.6-316.5s in all nine
# re-runs of jobs 118874344934, 118939059378 and 118975966027; beside three other
# tests in shard 2/2 it reached the 540s limit on all three first attempts. Whole,
# it costs that leg about 225s of sharing and leaves ~1.7x of its alone time
# under the limit. `review_round::the_busy_review_round_takes_the_whole_group`
# holds this in place.
[[profile.default.overrides]]
filter = 'binary(e2e) and test(=review_round::the_busy_review_round_ends_answered_and_true_and_records_what_it_spent)'
threads-required = 8
priority = 100
# llmlint: ignore-end[comments_earn_their_place]

# The longest journeys start first, so none of them starts late and runs on alone
# after the rest have finished. Two tiers, by alone time on this host's tier at
# 96e27397: 60s and over, then 30-60s. Every other one-thread test is under 30s.
# Before these, a 120s `writeback_budget` journey started 1,727s into a 1,847s tier
# and four tests last ran together 63s before its end; with them that tail was 11s.
# Both stay below the whole-group journeys' 100, for the `future-queue` stall the
# host-sized note above describes. A test(=…) naming no test matches nothing
# silently, so `tests/nextest_runs.rs` holds that each name here is still a journey.
[[profile.default.overrides]]
filter = '''
binary(e2e) and (
  test(=store::a_source_naming_no_reset_is_read_again_on_a_doubling_backoff_capped_at_thirty_intervals)
  or test(=writeback_budget::a_creating_copy_held_past_a_tiny_budget_is_cancelled_and_the_next_attempt_creates_it)
  or test(=check_visibility::an_optional_check_with_no_verdict_is_raised_once_and_moves_nothing)
  or test(=writeback_budget::adoption_replaces_the_budget_and_later_adoptions_keep_it)
  or test(=writeback_budget::an_update_held_past_a_tiny_budget_is_cancelled_and_the_refusal_names_the_arithmetic)
  or test(=store::a_held_hour_asks_the_store_what_its_reset_and_backoff_schedule_and_nothing_more)
)'''
priority = 60

[[profile.default.overrides]]
filter = '''
binary(e2e) and (
  test(=continuation::a_rate_limited_claim_read_ends_no_dispatch_and_holds_only_its_publication)
  or test(=linear_writeback::a_linear_destination_lands_current_values_after_each_way_a_call_fails)
  or test(=adoption::a_cross_dag_dependency_is_pinned_against_git_and_named_from_the_upstreams_ledger)
  or test(=lifecycle::a_change_the_host_never_lands_is_redispatched_on_the_branch_it_preserved)
  or test(=adoption_check::adopting_a_run_onevcs_says_can_no_longer_complete_drives_it_on_and_surfaces_the_rule)
  or test(=store::a_source_held_behind_resets_is_read_at_the_earliest_and_each_node_at_its_latest)
  or test(=driver_exit::a_live_retry_of_a_retried_node_is_dispatched_by_the_running_driver)
  or test(=review::a_continued_rework_refuses_projection_when_its_seeded_baseline_cannot_preserve_it)
  or test(=adoption::a_release_that_arrived_is_not_awaited_again_when_its_probe_stops_answering)
  or test(=continuation::a_claim_read_that_times_out_ends_no_dispatch_and_holds_only_its_publication)
  or test(=adoption::an_unchanged_release_wait_is_queued_again_only_once_read_and_a_changed_one_at_once)
  or test(=continuation::a_claim_read_that_fails_ends_no_dispatch_and_holds_only_its_publication)
  or test(=linear_writeback::command_end_refusal_and_timeout_rebuild_the_workers_store)
  or test(=continuation::a_claim_read_finding_its_landed_claim_gone_ends_no_dispatch_and_publishes)
  or test(=continuation::a_claim_read_finding_no_claim_ends_no_dispatch_and_publishes)
  or test(=closures::a_settled_run_waits_for_its_closures_no_longer_than_their_window)
  or test(=run_end_hooks::a_hook_that_fails_cannot_start_or_outlives_its_timeout_changes_nothing_the_run_settles_to)
  or test(=closures::an_adoption_writes_the_home_a_settled_run_could_not_reach_once)
)'''
priority = 30

# Declared on `default` and inherited by `ci`, so the cap holds on the
# cross-platform legs too. Asked of the runner rather than assumed: `cargo nextest
# show-config test-groups --profile ci` reports `group: e2e (max threads = 4)`.
[[profile.default.overrides]]
filter = 'binary(e2e) or binary(pooled_slot) or binary(narrow_write) or binary(note) or binary(release_channel)'
test-group = 'e2e'

# Show the non-gating liveness timings in passing local and CI runs.
#
# llmlint: ignore-block[contracts_have_one_source_or_a_drift_gate] Nextest
# rejects a binary() filter matching no target before running tests (exit 96
# when this name was deliberately changed), so it is the drift gate here.
# llmlint: ignore-block[changed_behavior_has_e2e] this only changes nextest's
# own output; testing it would require nesting nextest. Nextest validates the
# filter and setting when the focused binary runs.
[[profile.default.overrides]]
filter = 'binary(oneagentgraph_liveness)'
success-output = "final"
# llmlint: ignore-end[changed_behavior_has_e2e]
# llmlint: ignore-end[contracts_have_one_source_or_a_drift_gate]
