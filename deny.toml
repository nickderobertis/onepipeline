# cargo-deny policy. Strict by default: advisories, licenses, bans, and sources
# all fail the check rather than warn. Any exception below is explicit and
# carries a reason so the policy never silently accumulates debt. Run via
# `just deps-check` and a dedicated CI job (it needs a network advisory DB), not
# the core `just check` gate.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with this MIT-licensed crate. Adding a
# dependency with a new license fails the check until it is reviewed and added
# here, so the list stays a reviewed record rather than a wish list.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # The TLS stack `oneagentgraph` reaches its host over: ring, rustls-webpki,
    # untrusted (ISC), subtle (BSD-3-Clause), and the webpki root-certificate
    # bundles, whose CDLA-Permissive-2.0 covers the certificate *data* rather
    # than code. All are permissive and impose no condition MIT does not.
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # `borrow-or-share`, under the JSON Schema validator `oneharness-core` uses
    # to check envelopes. MIT-0 is MIT without the attribution clause — OSI
    # approved, and strictly more permissive than the MIT this crate itself
    # ships under, so it imposes no condition the allow list already accepts.
    "MIT-0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exactly the one sibling repository this crate pins by revision, and nothing
# else. `onevcs` was the second entry and no longer needs to be one: the revision
# it was pinned at is published, so `Cargo.toml` resolves it from the registry
# and an allowance kept here would permit a git source no build asks for.
#
# `unknown-git` stays `deny`, so this list is the whole of what a git source may
# be: a second one — a transitive dependency that grew a git pin, or another
# repository added here by hand — still fails this check. What it buys is the
# thing the filter grammar needs: that grammar is a *cross-repository* contract
# with no shared crate, so what has to be pinned is the revision the sibling's
# copy of it was merged at, before a release carries it.
#
# The reproducibility this replaced is not lost. The dependency pins an exact
# `rev` rather than a branch, and carries the registry `version` beside it — so
# the graph resolves to one commit, `Cargo.lock` records it, and `cargo publish`
# still records a registry dependency. `cargo publish --dry-run` is what holds
# that last part honest.
allow-git = ["https://github.com/nickderobertis/oneagentgraph"]
