# cargo-deny policy. Strict by default: advisories, licenses, bans, and sources
# all fail the check rather than warn. Any exception below is explicit and
# carries a reason so the policy never silently accumulates debt. Run via
# `just deps-check` and a dedicated CI job (it needs a network advisory DB), not
# the core `just check` gate.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with this MIT-licensed crate. Adding a
# dependency with a new license fails the check until it is reviewed and added
# here, so the list stays a reviewed record rather than a wish list.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # The TLS stack `oneagentgraph` reaches its host over: ring, rustls-webpki,
    # untrusted (ISC), subtle (BSD-3-Clause), and the webpki root-certificate
    # bundles, whose CDLA-Permissive-2.0 covers the certificate *data* rather
    # than code. All are permissive and impose no condition MIT does not.
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # `borrow-or-share`, under the JSON Schema validator `oneharness-core` uses
    # to check envelopes. MIT-0 is MIT without the attribution clause — OSI
    # approved, and strictly more permissive than the MIT this crate itself
    # ships under, so it imposes no condition the allow list already accepts.
    "MIT-0",
    # `foldhash`, the default hasher of the `hashbrown` release `indexmap` resolves
    # to since the bus adoption. Zlib is OSI approved and permissive: its only
    # conditions are not misrepresenting authorship and keeping the notice in
    # source redistributions, none beyond what MIT already asks.
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Narrows that `deny` to the one requirement nobody chose: a `path` dependency on
# a workspace member. There is exactly one — the `onepipeline-testfakes`
# dev-dependency — and it is `publish = false`, so no release exists for a version
# to name. Naming one anyway is not merely redundant but breaks publishing: cargo
# strips a version-less path dev-dependency from the packaged manifest and
# resolves a versioned one, so `cargo package` fails on a crate crates.io has
# never seen. cargo-deny still refuses a `*` that could reach a published
# artifact, so this buys that member and nothing else.
allow-wildcard-paths = true
allow = []
# The fleet's YAML contract: every YAML read and write goes through `serde-saphyr`, safe
# Rust, so a crate carrying the libyaml translation — or a reader built on it — that
# re-enters the graph through any dependency turns this check red.
deny = [
    { crate = "serde_yaml", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
    { crate = "serde_yaml_ng", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
    { crate = "serde_norway", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
    { crate = "serde_yml", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
    { crate = "unsafe-libyaml", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
    { crate = "unsafe-libyaml-norway", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
    { crate = "libyml", reason = "RUSTSEC-2024-0449: the unmaintained libyaml translation, or a reader built on it; YAML goes through serde-saphyr" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# One entry: the unreleased `onetaskgraph` revision `Cargo.toml`'s `[patch.crates-io]`
# links, and that block says why. The revision rather than the repository, so any
# other is still refused, and it is deleted in the same change that moves the three
# requirements to the release. `tests/patch_pin.rs` holds this list equal to that
# block's, so neither can move — or be deleted — without the other.
allow-git = ["https://github.com/nickderobertis/onetaskgraph?rev=ed79789488c62bbec4af948dde85951e788f6c6e"]
