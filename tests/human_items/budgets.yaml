# The budget the `human-items-e2e` project holds the host-wide human-items reads to, checked
# by `onebudgetspec check budgets.yaml` from this directory in that project's `test` target,
# after the journey that writes `target/budget-records/human-items.json`. The figure is read
# from that saved recording; nothing is timed twice.
schema_version: 1
budgets:
  - id: human-items-read-seconds
    measure: reported
    command: [node, report.mjs, ../../target/budget-records/human-items.json]
    unit: seconds
    direction: max
    threshold: 0.45
    description: >-
      Elapsed time of a complete host-wide human-items read as a subprocess of the
      release-built binary: the maximum of ten unchanged warm reads of each of `list --json`,
      `list`, `report` and `show --json` of the item carrying the longest history, over 100
      retained runs of 10,000 events, 100 open items and 10 managers whose plans hold 5 to 50
      steps (275 in all), with full bodies, three-step previews and complete blocked sets.
      The 90 manager-raised open items each carry a history of 2 to 5 events that leaves
      them open, one of them carries exactly 50 events and is the item the timed `show --json`
      reads, and the 10 items that are live runs' human gates keep only the raise their run
      recorded, so the 275-step blocked set and its 5-to-50 per-plan sizes are unchanged.
      Detail separates index I/O, run discovery, replay, blocked-work calculation, rendering
      and process/capture per form, names the slowest form, reports the shown item's history
      length, and discloses the cold, deleted-index and corrupt-index rebuilds and the
      ten-event tail separately; those recoveries are not a second ceiling. The threshold is
      arithmetic headroom, ceil((2 x 0.197229 + 0.025) / 0.05) x 0.05, over the indexed-read
      spike's largest mutable call (report authoring:human-action-items-spike-indexed-read-report),
      not a measured percentile; a 50-entry history adds about 10 KB to decode and serialize,
      well under a millisecond, so the detail read takes no new headroom.
