# The budget the `human-items-e2e` project holds the host-wide human-items reads to, checked
# by `onebudgetspec check budgets.yaml` from this directory in that project's `timed` target on
# a push to main, after the journey that writes `target/budget-records/human-items.json`. The
# figure is read from that saved recording; nothing is timed twice. A pull request's `test`
# counts what each of the same reads does instead, and times nothing.
schema_version: 1
budgets:
  - id: human-items-read-seconds
    measure: reported
    labels: [not-measured-on-pr]
    command: [node, report.mjs, ../../target/budget-records/human-items.json]
    unit: seconds
    direction: max
    threshold: 0.001
    description: >-
      Host-wide human-items read time, measured on every push to main by the `timed` job and
      never on a pull request: elapsed seconds of one complete host-wide human-items read as
      a subprocess of the release-built binary, its expiry sweep included — the maximum of ten
      unchanged warm reads of each of `list --json`, `list`, `report` and `show --json` of the
      item with the longest history. Workload: the reused human-items fixture, read on an
      ubuntu-24.04 runner on a push to main — 100 retained runs of 10,000 events (1,000,000
      run records), 100 open items, 10 managers whose plans hold 5 to 50 steps (275), 140
      expiry conditions none of which is due, and one item whose 50-event history is the
      longest, which `show --json` reads. Detail keeps the per-form breakdown (index I/O, run
      discovery, replay, blocked-work calculation, rendering, process and capture), each
      form's sweep time and conditions evaluated, the slowest form and the shown item's
      history length. Evidence: run 44921606038 (test-linux, PR #1771) recorded 0.0157 s, the
      maximum of 40 warm samples, over this workload. The threshold is the existing
      arithmetic headroom, ceil((2 x 0.197229 + 0.025) / 0.05) x 0.05, over the indexed-read
      spike's largest call (authoring:human-action-items-spike-indexed-read-report), not a
      measured percentile. The check adds about 120 seconds to the push-to-main `timed` job.
