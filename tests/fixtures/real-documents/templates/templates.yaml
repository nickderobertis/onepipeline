# A redacted copy of a real host file: this host's template registration
# (`templates/templates.yaml`), read by `src/yaml.rs`'s real-document test.
# It held no employer, workplace, private repository, path, host, user, email or internal
# URL to replace, so every byte below this header is the host's.
# This host's own template names, registered for `onepipeline template`. The host root is
# this directory: `scripts/onepipeline.sh` and `scripts/dispatch-env.sh` export it as
# `ONEPIPELINE_TEMPLATE_ROOT`. `plan-task` is the engine's own and is pre-registered, so it
# is overridden here by `plan-task.md.j2` rather than declared.
onepipeline_templates: 1
templates:
  follow-up-task:
    role: task
    description: A follow-up ticket, verified after a run and filed on the followups board.
  design-doc:
    role: document
    description: The design document a plan is read and approved as.
  plan-description:
    role: project
    description: A plan's own description, carrying its plan-level budget answers.
  spike-report:
    role: document
    description: A spike's report, stored as the document `<spike id>-report` of the plan's own project.
