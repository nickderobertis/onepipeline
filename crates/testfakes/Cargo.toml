# Test-support only: the programs `onepipeline` and its siblings reach as
# subprocesses, as real executables a test can drive them against.
#
# There is no `onevcs` here. That sibling is reached by *calling* it, so there is
# no subprocess boundary to substitute at — what stands in instead is `gh`, at
# `onevcs`'s own `ONEVCS_GH` override, which decides what GitHub does and leaves
# every git operation real.
#
# A separate workspace member rather than extra `[[bin]]`s on the crate itself,
# because these must never ship in the published artifact. `cargo test` builds
# every workspace member's binaries, so `tests/e2e` finds them beside the
# `onepipeline` binary it already resolves through cargo.
[package]
name = "onepipeline-testfakes"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Subprocess doubles for oneagentgraph and onevcs, used by onepipeline's e2e tests."

[dependencies]
serde_json = "1"
# The sibling itself, so the `oneagentgraph` double refuses a `--label` by asking
# the real CLI's own parser rather than by keeping a second copy of the keys it
# reserves — a copy is a list that goes stale the round after the sibling adds one.
oneagentgraph = { workspace = true }

[[bin]]
name = "fake-oneagentgraph"
path = "src/bin/fake-oneagentgraph.rs"

# GitHub, at `onevcs`'s own `ONEVCS_GH` seam. It needs no dependency on that
# crate: what it speaks is `gh`'s command surface, and what holds it honest is
# `tests/smoke/`, which runs the same publication against the real `gh`.
[[bin]]
name = "fake-gh"
path = "src/bin/fake-gh.rs"

# One layer further out than the other two: this stands in for the paid model
# turn only, for the journeys that drive the real `oneagentgraph` binary.
[[bin]]
name = "fake-oneharness"
path = "src/bin/fake-oneharness.rs"

# A repository-owned gate command. Unlike a shell script, this is the same
# executable on every platform the lifecycle journeys exercise.
[[bin]]
name = "fake-gate"
path = "src/bin/fake-gate.rs"

[lib]
name = "onepipeline_testfakes"
path = "src/lib.rs"
