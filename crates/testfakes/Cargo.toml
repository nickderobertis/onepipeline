# Test-support only: the programs `onepipeline` and its siblings reach as
# subprocesses, as real executables a test can drive them against.
#
# Nothing here stands in for `onevcs`. That sibling is reached by *calling* it, so
# there is no subprocess boundary to substitute at — what stands in instead is
# `gh`, at `onevcs`'s own `ONEVCS_GH` override, which decides what GitHub does and
# leaves every git operation real. The dependency below is not a substitution: it
# is how the `oneagentgraph` double writes a record onto a session's stream in
# that library's own declared shape rather than a copy of it.
#
# A separate workspace member rather than extra `[[bin]]`s on the crate itself,
# because these must never ship in the published artifact. `cargo test` builds
# every workspace member's binaries, so `tests/e2e` finds them beside the
# `onepipeline` binary it already resolves through cargo.
[package]
name = "onepipeline-testfakes"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Subprocess doubles for oneagentgraph and onevcs, used by onepipeline's e2e tests."

[dependencies]
# The supervising side reads a verdict as a *typed* shape rather than probing a
# JSON object for keys, so a half of the wrong type is not a ruling here either.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sibling itself, so the `oneagentgraph` double refuses a `--label` by asking
# the real CLI's own parser rather than by keeping a second copy of the keys it
# reserves — a copy is a list that goes stale the round after the sibling adds one.
oneagentgraph = { workspace = true }
# The session stream's own envelope, so a double writing a record to one writes
# the shape `onevcs` declares — a restatement here would keep parsing after that
# library changed it, and the journey would pass having proved the fixture.
onevcs = { workspace = true }
# The verdict a two-party member settles on, so this double writes it in the
# shape **onejudge** declares rather than one hand-rolled here — the same reason
# the two pins above are taken rather than restated.
onejudge = { workspace = true }
# The report a spawned `oneharness run` answers with, in oneharness's own typed
# shape. It is onejudge that parses it — the `oneharness` double stands at the one
# process boundary a two-party member still has — so the pin is the copy onejudge
# links; see `[workspace.dependencies]`.
oneharness-core = { workspace = true }
# The identity chain an `oneharness` config declares is TOML, and the `oneharness`
# double reads it rather than assuming what it will find: a config the sibling
# composed that does not parse, or that names a chain with nothing in it, is a
# launch prepared wrongly, and a double that answered anyway would settle a member
# on it. Already in the graph — `oneharness-core` builds it.
toml = "1"
# The graph document's own reader, so the observer double runs the judge-side
# provider the graph *declares* rather than one it remembered: a graph that named
# a different provider would otherwise still be supervised by this copy.
serde_norway = "0.9"

# So a double can act out the one dispatch behaviour a rendezvous cannot: a
# worker that keeps working through the polite ask to stop. The crate under test
# names the same dependency for the same platform, and for the same reason —
# what a process does with a signal is not a `std` question on this MSRV floor.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "fake-oneagentgraph"
path = "src/bin/fake-oneagentgraph.rs"

# GitHub, at `onevcs`'s own `ONEVCS_GH` seam. It needs no dependency on that
# crate: what it speaks is `gh`'s command surface, and what holds it honest is
# `tests/smoke/`, which runs the same publication against the real `gh`.
[[bin]]
name = "fake-gh"
path = "src/bin/fake-gh.rs"

# One layer further out than the other two: this stands in for the paid model
# turn only, for the journeys that drive the real `oneagentgraph` binary. It is
# the *harness* rather than `oneharness`, because a single-sided member's turn is
# an `oneharness_core` library call from `oneagentgraph 0.2.18` on and the only
# process left below it is the one oneharness spawns for the identity chain, at
# that library's own `ONEHARNESS_BIN_<ID>`.
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

# `oneharness` itself, at the seam the library conversion left behind: the
# executable a two-party member's composed provider block names, and the one an
# in-flight redirection is delivered by. No single-sided turn comes through it.
[[bin]]
name = "fake-oneharness"
path = "src/bin/fake-oneharness.rs"

# Not a double at all: a **real** node validator, as `--node-validator` names
# one. The hook's promise is that a command the consuming host names is run, and
# that host's own validator reads documents this crate has never seen — so what
# the journeys drive is a real program at that seam, scripted from the same
# directory the doubles are. It lives here because it must never ship either.
[[bin]]
name = "node-validator"
path = "src/bin/node-validator.rs"

[lib]
name = "onepipeline_testfakes"
path = "src/lib.rs"
