[workspace]
# The crate at the root, plus the test-support crate whose binaries stand in for
# the two siblings at their subprocess boundary. Members are listed explicitly so
# a new one joins the graph deliberately rather than by changing what
# `--workspace` means.
members = [".", "crates/testfakes"]
resolver = "2"

[package]
name = "onepipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Execute a task DAG over oneagentgraph and onevcs, merging their event streams into one."
license = "MIT"
repository = "https://github.com/nickderobertis/onepipeline"
homepage = "https://github.com/nickderobertis/onepipeline"
readme = "README.md"
keywords = ["orchestration", "dag", "agents", "cli", "ndjson"]
categories = ["command-line-utilities", "development-tools"]
# What a consumer receives: the sources, the manifest, the readme, the licence,
# the contract the API is written against — `tests/contract.rs` reads
# `docs/contract.md`, so shipping the code without it would ship a crate whose
# own test cannot run — and the shipped content the contract names. Excludes the
# CLAUDE.md/AGENTS.md symlink (registries reject symlinks), CI config, and the
# packaging scaffolding.
include = [
  "src/**/*.rs",
  "tests/**/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "/docs/contract.md",
  "/personas/**",
  "/graphs/**",
  "/examples/**",
]

[[bin]]
name = "onepipeline"
path = "src/main.rs"

[lib]
name = "onepipeline"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, so a re-serialized
# envelope or reply carries its payload's fields in the order they arrived —
# what the contract's deterministic rendering promise needs.
serde_json = { version = "1", features = ["preserve_order"] }
# Plan files are JSON; the executor-rules file and the agent-graph configs are
# YAML. serde_norway is the maintained fork of the deprecated serde_yaml, and is
# the same reader the sibling crates use.
serde_norway = "0.9"
thiserror = "2"

# The siblings this crate composes. Each carries a `version` as well as its
# `git`/`rev` so it is not a wildcard dependency; the `rev` is what cargo
# resolves until that version is on crates.io. See src/AGENTS.md.
oneagentgraph = { version = "0.1", git = "https://github.com/nickderobertis/oneagentgraph.git", rev = "e88f70aabf3f60ae380c26228de640f1e5af2441" }
onevcs = { version = "0.1", git = "https://github.com/nickderobertis/onevcs.git", rev = "131bad3ee4d6ee95754d909d8b460f2da4258b63" }

# Process liveness is the one host fact this crate cannot get from `std` on the
# MSRV floor, and every `DRIVER DEAD` / `PARKED` verdict rests on it. Both are
# already in the dependency graph transitively; naming them here makes the
# platform call explicit rather than incidental.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

# No dev-dependencies. The e2e suite drives the compiled binary as a subprocess
# with `std::process` and reads what it wrote, so it needs no command-assertion
# crate — `tests/e2e/harness.rs` is the whole of it. The subprocess doubles for
# the two siblings are a workspace member rather than a dependency: a dev-dep
# would build that crate's *library*, and what the suite needs is its binaries,
# which the harness builds on demand.

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
