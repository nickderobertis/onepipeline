[workspace]
# The crate at the root, plus the test-support crate whose binaries stand in for
# the programs this stack spawns: `oneagentgraph`, and the `gh` behind `onevcs`.
# Members are listed explicitly so a new one joins the graph deliberately rather
# than by changing what `--workspace` means.
members = [".", "crates/testfakes"]
resolver = "2"

# The siblings this crate composes, pinned once for the whole workspace so both
# members build against the same version. `onevcs` is *called* rather than
# spawned, so nothing stands in for it; the `oneagentgraph` double still answers
# out of the real crate's own types — it refuses what the real CLI refuses by
# calling its parser — because a double that accepted more than the sibling is an
# oracle for a build nothing runs.
#
# `oneagentgraph`'s floor is a **requirement**, and it is one about *this* build
# rather than about any install: the dispatch path links the crate, so raising a
# pinned CLI wheel or an installed binary does not raise this floor.
#
# Two things below the floor, each of which a launch must have:
#
# - 0.2.12 starts a two-party (`kind: onejudge`) member in the directory the
#   graph was given. Below it that member works in `<state>/runs/<graph
#   run>/members/<member>`, which is not a repository, so a lifecycle node's work
#   never reaches the branch publication reads and is discarded as `no-changes`.
# - 0.2.11 expands `{task}` in a member's own `task` to the run's, which is what
#   a dag-scope graph composes its members' roles out of. Below it those six
#   characters stand for themselves and every member is handed the bare run
#   description with no job attached.
#
# `tests/e2e/dispatch.rs` holds the first end to end: it fails against 0.2.11
# rather than merely reading differently.
#
# **Both siblings are registry releases**, and **neither may carry a `git`/`rev`
# pin**, because a revision is content this host cannot reproduce from crates.io
# and a crate that itself ships there cannot publish against one.
#
# The filter grammar this crate passes through to them — a *cross-repository*
# contract with no shared crate — is carried by both pins: `oneagentgraph` merged
# it at v0.2.13 and `onevcs` at v0.2.7, and each pin below is above its own.
# `tests/e2e/dispatch.rs` and `tests/e2e/real_vcs.rs` drive those surfaces against
# the real siblings, so a pin moved below one fails rather than reads differently.
#
# Further floors, each a **requirement** of what this crate composes today:
#
# - `oneagentgraph` 0.2.16 lets a `kind: oneharness` member's own oneharness
#   config decide its run — `schema_file` there asks for a validated JSON answer,
#   which is what the pr-author graph a launch names declares and what puts the
#   drafted body at `results[].structured` of the report that member's
#   `member-settled` names. Below it that member is always run with `--stream`,
#   which oneharness refuses beside a schema, so the drafting dispatch is a usage
#   error rather than a structured answer.
# - `oneagentgraph` 0.2.18 runs a single-sided member's turn through the
#   oneharness *library*. Below it that turn is a process, and every seam this
#   build reads it through — the classification a death is reported under, the
#   teardown of the harness tree, `member-started`'s fields — is the other one.
# - `oneagentgraph` 0.3.0 is the release a persona is a **onejudge config
#   fragment** in: the role is the top-level `system_prompt` and the label the
#   top-level `name`, and the `agent:` block that spelled both before is refused
#   outright — no alias, no flag, no deprecation period. The three personas under
#   `personas/` are shipped content written in that format, so below 0.3.0 the
#   files this crate ships do not load at all — which is why the requirement is
#   the one below rather than the `0.2.18` it replaces: a caret over that pin
#   excludes 0.3.0, so the declaration, not the lock, was the constraint.
#   `tests/e2e/shipped.rs` reads each shipped persona through the sibling's own
#   `Persona::parse` and layers it onto a base, so a file in the wrong spelling
#   fails rather than reads differently.
# - `onevcs` 0.2.8 raises `provenance::SUBJECT_LIMIT` from 72 to 120, which
#   `src/graph.rs` reads to refuse an unpublishable node title at plan load — so
#   the `onevcs` pin also decides which titles a plan may state. Below it a load
#   refuses every title between the two that the publication commits without
#   complaint. `tests/e2e/real_vcs.rs` drives the surface.
# - `onevcs` 0.4.0 carries `PublishRequest.body`, which is the whole of what a
#   drafted body is *for*: below it a change request opens with the boilerplate
#   this crate has no way to replace. 0.4.1 adds a stacked-branch publish above it.
# - `onevcs` 0.8.0 **continues** a pinned branch that already exists, cutting the
#   session onto its own tip instead of refusing the pin with `already carries N
#   commit(s) that main does not`. That refusal is what stranded a retry on work
#   its predecessor preserved, and 0.4.2's session reuse only reached the narrow
#   case where the predecessor's session was still open — a closed one, or a
#   branch somebody landed by hand, met the refusal. It is a **requirement** and
#   not merely a lock floor because `^0.4.1` excludes it: pre-1.0, the minor is
#   the breaking position, so the declaration rather than the lock is what
#   permits the resolution. The same release refuses `base_branch` equal to
#   `branch` — the folklore spelling that got past the old refusal by comparing a
#   branch with itself — when the session opens, and names the pin above in its
#   place; `src/plan.rs` documents both fields against that. `tests/e2e/
#   session_reuse.rs` and `tests/e2e/lifecycle.rs` drive the two halves, so a pin
#   below 0.8.0 fails rather than reads differently.
# - `onevcs` 0.11.0 removes the **gate** — the tier that library ran itself, the
#   `gate:` key a rules file named it in, and the `gate-started` and
#   `gate-verdict` records it wrote — and leaves the repository's own merge path
#   as the only verifier: the host's required checks where a change publishes
#   remotely, and the repository's `pre-push` hook at the publishing push where it
#   publishes locally. A `push` carries `accepted`, which is that path's verdict.
#   Rules schema 3 is the shape with no `gate:` in it; 1 and 2 still load and drop
#   one. It is a **requirement** and not a lock floor for the same reason 0.8.0
#   was: `^0.10.0` excludes it, because pre-1.0 the minor is the breaking
#   position.
#   `tests/e2e/real_vcs.rs` drives both verdicts against a real origin — a
#   publishing push a `pre-push` hook lets through and one it refuses — and
#   `tests/e2e/harness.rs` writes the version-3 rules and installs the hook
#   through `core.hooksPath`, which `onevcs` carries into the clone a session
#   cuts. Below 0.11.0 the suite fails on the rules version rather than reading
#   differently. Nothing this crate names went away with it: `FailureKind::Gate`
#   and the contract's `gate` WALL bucket are both kept, the first because the
#   cross-library failure vocabulary is fixed and the second because a bucket
#   nothing measures is served absent — `src/telemetry.rs` documents that.
# - `onevcs` 0.11.1 **refuses to reap a session worktree holding commits its own
#   branch does not carry**, copying them where the execution checkout will take
#   them first. Below it, a worker that ran `git checkout -b fix/…` loses
#   everything it committed there when the worktree goes — half an hour of
#   gate-green work on the operator's host, under a node reporting `merged`.
#   `tests/e2e/lifecycle.rs`'s
#   `work_a_worker_committed_on_a_branch_of_its_own_outlives_the_session` drives
#   it, and fails below the floor rather than reading differently.
# - `onevcs` 0.12.0 adds `FailureKind::PushedUnverified` — the publishing push
#   **reached the remote** and the merge path could not then be read — which
#   `src/vcs.rs` routes **preserving**, under `pushed-unverified`, because asking
#   again is what answers a read that never happened. It is a **requirement** and
#   not a lock floor for the reason 0.8.0 and 0.11.0 were: `^0.11.0` excludes it,
#   because pre-1.0 the minor is the breaking position. `tests/e2e/lifecycle.rs`'s
#   `a_push_whose_merge_path_goes_unread_is_redispatched_with_the_work_on_the_origin`
#   drives that ending against the real sibling, and `failure_of` matches arm by
#   arm, so a pin below 0.12.0 does not compile.
#
# Four floors are carried by `Cargo.lock` rather than by the requirement below,
# and deliberately.
#
# `oneagentgraph` 0.3.3 carries the **session-conversation producer**: a `session`
# label naming the conversation a member's turns belong to, and the
# `oneharness-session` event naming the history record one oneharness invocation
# wrote, with that record as its artifact. Which kinds carry the label is that
# library's to say — `EventKind::carries_session` — and is not restated here. It
# is what an operator's conversation view renders an agent's transcript out of,
# and this crate relays all of it. `^0.3.0` already permits it, so the resolution
# is the whole of the fix and widening the requirement would buy nothing.
# `src/agentgraph.rs`'s
# `the_linked_oneagentgraph_produces_the_session_conversation_this_crate_relays`
# is what holds the resolution there — below the floor it fails saying the lock
# is stale — and `tests/e2e/session.rs` drives the relay itself.
#
# `oneagentgraph` 0.3.5 corrects the **shipped role bars** so none of them demands
# anything a dispatch cannot settle inside its own run, and guards the rest
# against regrowing one. `engineer` is the role `src/executor.rs` names on
# `members.worker`, and its bar refused "done" until the behaviour was *proven end
# to end* — which nothing running inside a dispatch can show now that no gate runs
# inside the publication and verification is the merge path's, so every
# implementation node would fail its review. The bar is the *linked library's*
# file and not anything this crate ships, so the lock is what decides which one a
# judge is handed. `^0.3.0` already permits it, so again the resolution is the
# whole of the fix. `src/agentgraph.rs`'s
# `the_linked_oneagentgraph_holds_the_engineer_bar_to_what_a_dispatch_can_prove`
# holds it, and asserts what replaced the demand as well as its absence, so a
# resolution that softened the bar rather than narrowing it fails there too.
#
# `oneagentgraph` 0.3.6 carries the **whole turn** rather than an outline of one:
# the `turn-message` kind, a turn's opening and the instruction it answers, the
# observation that answered a tool call and the id joining the two, and a
# `turn-completed` that closes one turn on that turn's own account. It is also
# the release that moves `onejudge` — 0.3.6 requires 0.5, and the pin below must
# be the version *that* pin resolves to. `src/agentgraph.rs`'s
# `the_linked_oneagentgraph_produces_the_whole_turn_this_crate_relays` holds the
# resolution, and `tests/e2e/turns.rs` drives the relay itself.
#
# `oneagentgraph` 0.3.8 moves the **activity rule's default bound** from ten
# minutes to half an hour. Every dispatch this crate makes runs as a single-sided
# member, whose clock that rule stamps on tool events and on live work under the
# tree and on nothing else — so a member spending a quarter of an hour composing
# a report reads as silent, and under the old bound was killed mid-report.
# `^0.3.0` already permits it, so the resolution is the whole of the fix.
# `tests/oneagentgraph_liveness.rs` holds both halves of it against the linked
# library: the bound a dispatch really runs under, read through that library's
# own launch-time `Bounds::from_env`, and the rule that bound governs, driven
# over real processes under a bound the environment sets small. The lock
# resolves 0.3.9, the newest the caret permits, whose addition — a script run
# before a member's turn — this crate names nowhere.
#
# `onejudge` 0.5.1 and the `oneharness-core` 0.10.x copy at 0.10.2 move with the
# lock and carry **no runtime behaviour a dispatch observes** — onejudge 0.5.1
# changes no `src/` file at all — so they are here to keep the lock current
# rather than for a fix. The `oneharness-core` 0.8 copy stays where it is, for
# the reason the entry below gives.
#
# What keeps this block's resolutions at what its own requirements permit is no
# longer whoever thinks to look: `just lock-current` fails when one lags, and
# every release's notes record what that release links.
[workspace.dependencies]
oneagentgraph = "0.3.0"
onevcs = "0.12"
# **Not a third sibling this crate composes** — nothing here launches, calls, or
# spawns onejudge. It is one vocabulary: the verdicts a two-party member settles
# on, which `oneagentgraph` copies onto the `member-settled` this crate relays.
# It adds nothing to the dependency graph, because `oneagentgraph` already builds
# it — and it must resolve to the version *that* pin does. `src/report.rs` is
# where the build fails if it ever resolves to two, and why.
onejudge = "0.5"
# **Test-support only**, and named for one reason: `crates/testfakes`'s
# `oneharness` double writes the report onejudge reads back, and that report is
# oneharness's own typed contract. Written by hand it would be fifty fields of
# copied wire shape that goes on parsing after the producer changed it — which is
# the failure every other pin in this block is taken to avoid.
#
# `"0.8"` rather than the newest, because the reader is **onejudge**: it links
# `oneharness-core` 0.8 while `oneagentgraph` links 0.10, so the graph already
# carries both and the double has to write the copy its consumer parses. If
# onejudge's pin moves, this one no longer unifies with it and
# `tests/e2e/turns.rs` fails on a report shape onejudge cannot read — which names
# the drift rather than hiding it. Nothing this crate publishes links it.
oneharness-core = "0.8"
# The sibling's own test-support crate, from the **same** revision as the library
# it implements — here by resolving both from the registry at the releases cut
# from one commit: `onevcs-testing` v0.4.0 and `onevcs` v0.11.0 are the same tag,
# and v0.4.0 requires `onevcs = "0.11.0"`, so the build has one copy. Two copies
# is not a version skew but a compile error: `tests/onevcs_seam.rs` — whose whole
# job is to drive this crate's seam against those providers — would not build,
# because the two copies' types are different types.
onevcs-testing = "0.4.0"

[package]
name = "onepipeline"
version = "0.12.3"
edition = "2021"
rust-version = "1.88"
description = "Execute a task DAG over oneagentgraph and onevcs, merging their event streams into one."
license = "MIT"
repository = "https://github.com/nickderobertis/onepipeline"
homepage = "https://github.com/nickderobertis/onepipeline"
readme = "README.md"
keywords = ["orchestration", "dag", "agents", "cli", "ndjson"]
categories = ["command-line-utilities", "development-tools"]
# What a consumer receives: the sources, the manifest, the readme, the licence,
# the contract the API is written against — `tests/contract.rs` reads
# `docs/contract.md`, so shipping the code without it would ship a crate whose
# own test cannot run — and the shipped content the contract names. Excludes the
# CLAUDE.md/AGENTS.md symlink (registries reject symlinks), CI config, and the
# packaging scaffolding.
include = [
  "src/**/*.rs",
  "tests/**/*.rs",
  # The per-platform gate scripts the lifecycle journeys write into their own
  # scratch. `include_str!`'d, so a packaged crate without them does not compile
  # its own test binary.
  "tests/e2e/gate.sh",
  "tests/e2e/gate.bat",
  # The checked-in goldens `src/telemetry.rs` and `src/filter.rs` read at compile
  # time — the telemetry document, and one launch config per schema version this
  # build reads. Without them the packaged crate does not build, let alone test.
  "tests/golden/*.json",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "/docs/contract.md",
  "/personas/**",
  "/graphs/**",
  "/examples/**",
]

[[bin]]
name = "onepipeline"
path = "src/main.rs"

[lib]
name = "onepipeline"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, so a re-serialized
# envelope or reply carries its payload's fields in the order they arrived —
# what the contract's deterministic rendering promise needs.
serde_json = { version = "1", features = ["preserve_order"] }
# Plan files are JSON; the executor-rules file and the agent-graph configs are
# YAML. serde_norway is the maintained fork of the deprecated serde_yaml, and is
# the same reader the sibling crates use.
serde_norway = "0.9"
thiserror = "2"

# The siblings this crate composes, at the workspace's own pins. See
# `[workspace.dependencies]` for what each pin's floor is a requirement of, and
# why both are registry releases.
oneagentgraph = { workspace = true }
onevcs = { workspace = true }
# Read-only vocabulary, not a composed sibling — see `[workspace.dependencies]`.
onejudge = { workspace = true }

# Process liveness is the one host fact this crate cannot get from `std` on the
# MSRV floor, and every `DRIVER DEAD` / `PARKED` verdict rests on it. Both are
# already in the dependency graph transitively; naming them here makes the
# platform call explicit rather than incidental.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

# Four dev-dependencies, and none is a test framework. The e2e suite drives the
# compiled binary as a subprocess with `std::process` and reads what it wrote, so
# it needs no command-assertion crate — `tests/e2e/harness.rs` is the whole of it.
#
# `onepipeline-testfakes` is here for its **library** only: the doubles' binaries
# come from the workspace member, which `tests/e2e/harness.rs` builds on demand,
# because a dev-dep builds a crate's library and not its binaries. What the
# library carries is the vocabulary the two sides share — the environment keys a
# double reads its scenario out of — so the writer and the reader of each key have
# one spelling instead of two that drift apart in silence.
#
# `onevcs-testing` is the sibling's own implementations of the two interfaces it
# is built around, which is what `tests/onevcs_seam.rs` drives to hold every
# operation `src/vcs.rs` performs to the seam it performs it on — in code rather
# than in prose, with no git, no host, and no process. Both are dev-dependencies
# and must stay so: what they implement must never be reachable from a release
# binary.
#
# `fs4` and `sha2` are one journey's tools, not a second implementation of
# anything: `tests/e2e/session_reuse.rs` has to make a run root *occupied* —
# taken exclusively, which is the one answer that stops `onevcs` reusing a
# session — and no verb of that sibling's holds an occupancy lease past its own
# exit, because the lease is deliberately one the OS releases with the process.
# So that journey takes the advisory lock itself, on the file the sibling names
# the lease after: `fs4` is the lock (the same crate, and the same lock, `onevcs`
# uses) and `sha2` spells the name. Both are already in the graph through the
# siblings, so neither adds anything to what this build resolves.
[dev-dependencies]
fs4 = "0.13"
onepipeline-testfakes = { path = "crates/testfakes" }
onevcs-testing = { workspace = true }
sha2 = "0.10"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# The real-everything tier, in its own binary so the offline gate can exclude it
# by name: `just test`, `just test-quick`, and therefore `just gate` run
# `not binary(smoke)`, and `just smoke-real` runs this and nothing else. It needs
# a GitHub credential and a scratch repository, and it refuses rather than skips
# when it has neither — which is why it must not be in the set a laptop runs.
[[test]]
name = "smoke"
path = "tests/smoke/main.rs"

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
