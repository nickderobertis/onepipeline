[workspace]
# The crate at the root, plus the test-support crate whose binaries stand in for
# the programs this stack spawns: `oneagentgraph`, and the `gh` behind `onevcs`.
# Members are listed explicitly so a new one joins the graph deliberately rather
# than by changing what `--workspace` means.
members = [".", "crates/testfakes"]
resolver = "2"

# The siblings this crate composes, pinned once for the whole workspace so both
# members build against the same version. `onevcs` is *called* rather than
# spawned, so nothing stands in for it; the `oneagentgraph` double still answers
# out of the real crate's own types — it refuses what the real CLI refuses by
# calling its parser — because a double that accepted more than the sibling is an
# oracle for a build nothing runs.
#
# `oneagentgraph`'s floor is a **requirement**, and it is one about *this* build
# rather than about any install: the dispatch path links the crate, so raising a
# pinned CLI wheel or an installed binary does not raise this floor.
#
# Two things below the floor, each of which a launch must have:
#
# - 0.2.12 starts a two-party (`kind: onejudge`) member in the directory the
#   graph was given. Below it that member works in `<state>/runs/<graph
#   run>/members/<member>`, which is not a repository, so a lifecycle node's work
#   never reaches the branch publication reads and is discarded as `no-changes`.
# - 0.2.11 expands `{task}` in a member's own `task` to the run's, which is what
#   a dag-scope graph composes its members' roles out of. Below it those six
#   characters stand for themselves and every member is handed the bare run
#   description with no job attached.
#
# `tests/e2e/dispatch.rs` holds the first end to end: it fails against 0.2.11
# rather than merely reading differently.
#
# **Both siblings are registry releases.** Neither carries a `git`/`rev` pin, and
# neither should: a revision is content this host cannot reproduce from
# crates.io, and a crate that itself ships on crates.io cannot publish against
# one. `oneagentgraph` was pinned to `7854b19` — the tag `v0.2.13` exactly, the
# release commit of the pull request that merged its filter support (#40) — only
# because no release carried that grammar yet. v0.2.13 is an ancestor of 0.2.18,
# so the release carries the same grammar the revision did, and the pin is
# retired rather than moved. `tests/e2e/dispatch.rs` drives that surface against
# the real sibling, so a version below it fails rather than reads differently.
#
# What each floor buys, above the two entries already listed:
#
# - `oneagentgraph` 0.2.18 dispatches a single-sided member's turn through the
#   oneharness *library* (#50), on top of 0.2.17's link against the released
#   oneharness-core 0.10 and onejudge 0.4 (#48), 0.2.16's deference to a member's
#   own oneharness config (#46) and 0.2.14's repo-local persona dispatch (#42).
#   Below it a run gets different classification, teardown and persona behaviour
#   than the launcher promises.
# - `onevcs` 0.4.1 refuses an empty-diff publication and raises the subject limit
#   to 120 (#30), which is the constant `src/graph.rs` reads as
#   `onevcs::provenance::SUBJECT_LIMIT` to refuse an unpublishable node title at
#   plan load — it is 72 below 0.2.8, so an older build refuses at load every
#   title the publication would commit without complaint. Above that it carries
#   the coloured check-log fetch that never stores a failure as a success (#32),
#   the gate fix that drains both child pipes so a loud gate cannot deadlock
#   (#34), publication by branch name with guided refusals (#36), preserved-work
#   discovery (#38), a caller-supplied change-request body (#40) and the leased
#   push of a replayed stacked branch (#43). `tests/e2e/real_vcs.rs` drives the
#   surface.
[workspace.dependencies]
oneagentgraph = "0.2.18"
onevcs = "0.4.1"
# The sibling's own test-support crate, from the **same** revision as the library
# it implements — here by resolving both from the registry at the releases cut
# from one commit: `onevcs-testing` v0.2.1 and `onevcs` v0.4.1 are the same tag,
# and v0.2.1 requires `onevcs = "0.4.1"`, so the build has one copy. Two copies
# is not a version skew but a compile error: `tests/onevcs_seam.rs` — whose whole
# job is to drive this crate's seam against those providers — would not build,
# because the two copies' types are different types.
onevcs-testing = "0.2.1"

[package]
name = "onepipeline"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
description = "Execute a task DAG over oneagentgraph and onevcs, merging their event streams into one."
license = "MIT"
repository = "https://github.com/nickderobertis/onepipeline"
homepage = "https://github.com/nickderobertis/onepipeline"
readme = "README.md"
keywords = ["orchestration", "dag", "agents", "cli", "ndjson"]
categories = ["command-line-utilities", "development-tools"]
# What a consumer receives: the sources, the manifest, the readme, the licence,
# the contract the API is written against — `tests/contract.rs` reads
# `docs/contract.md`, so shipping the code without it would ship a crate whose
# own test cannot run — and the shipped content the contract names. Excludes the
# CLAUDE.md/AGENTS.md symlink (registries reject symlinks), CI config, and the
# packaging scaffolding.
include = [
  "src/**/*.rs",
  "tests/**/*.rs",
  # The per-platform gate scripts the lifecycle journeys write into their own
  # scratch. `include_str!`'d, so a packaged crate without them does not compile
  # its own test binary.
  "tests/e2e/gate.sh",
  "tests/e2e/gate.bat",
  # The checked-in telemetry golden, which `src/telemetry.rs` reads at compile
  # time: without it the packaged crate does not build, let alone test.
  "tests/golden/*.json",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "/docs/contract.md",
  "/personas/**",
  "/graphs/**",
  "/examples/**",
]

[[bin]]
name = "onepipeline"
path = "src/main.rs"

[lib]
name = "onepipeline"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order, so a re-serialized
# envelope or reply carries its payload's fields in the order they arrived —
# what the contract's deterministic rendering promise needs.
serde_json = { version = "1", features = ["preserve_order"] }
# Plan files are JSON; the executor-rules file and the agent-graph configs are
# YAML. serde_norway is the maintained fork of the deprecated serde_yaml, and is
# the same reader the sibling crates use.
serde_norway = "0.9"
thiserror = "2"

# The siblings this crate composes, at the workspace's own pins — a git revision
# each, with the registry version beside it that publishing records. See
# `[workspace.dependencies]` for why the revision rather than the release.
oneagentgraph = { workspace = true }
onevcs = { workspace = true }

# Process liveness is the one host fact this crate cannot get from `std` on the
# MSRV floor, and every `DRIVER DEAD` / `PARKED` verdict rests on it. Both are
# already in the dependency graph transitively; naming them here makes the
# platform call explicit rather than incidental.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

# One dev-dependency, and it is not a test framework. The e2e suite drives the
# compiled binary as a subprocess with `std::process` and reads what it wrote, so
# it needs no command-assertion crate — `tests/e2e/harness.rs` is the whole of
# it — and the subprocess doubles are a workspace member rather than a
# dependency, because a dev-dep would build that crate's *library* and what the
# suite needs is its binaries.
#
# `onevcs-testing` is the sibling's own implementations of the two interfaces it
# is built around, which is what `tests/onevcs_seam.rs` drives to hold every
# operation `src/vcs.rs` performs to the seam it performs it on — in code rather
# than in prose, with no git, no host, and no process. It is a dev-dependency and
# must stay one: what it implements must never be reachable from a release
# binary.
[dev-dependencies]
onevcs-testing = { workspace = true }

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# The real-everything tier, in its own binary so the offline gate can exclude it
# by name: `just test`, `just test-quick`, and therefore `just gate` run
# `not binary(smoke)`, and `just smoke-real` runs this and nothing else. It needs
# a GitHub credential and a scratch repository, and it refuses rather than skips
# when it has neither — which is why it must not be in the set a laptop runs.
[[test]]
name = "smoke"
path = "tests/smoke/main.rs"

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
