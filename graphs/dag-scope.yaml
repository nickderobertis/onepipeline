# The dag-scope agent graph `onepipeline start --dag-graph REF` launches: a
# monitor that watches the run, and a pacemaker that surfaces a status when
# nobody has reported one for a while.
#
# Nothing here drives the run. `onepipeline start` runs the engine's own loop,
# and this graph is optional — the shipped default is `--dag-graph off`, because
# no agent is required to execute a plan. A member of this graph observes and
# authors channel surfaces; it never runs an engine verb.
#
# The two `*_config` paths are the operator's own onejudge and oneharness
# configs — this graph names them, it does not ship them, exactly as the
# oneagentgraph contract's own example does.
#
# The task `onepipeline start` composes says what the run *is* and nothing about
# who does what with it, because `oneagentgraph` gives it to every member here
# that carries none of its own. Each member's job is stated in its persona
# instead — a graph replacing this one says it there, or in a member `task`
# composed from `{task}`, which needs the schema version `oneagentgraph`
# documents as `config::FIRST_TASK_TOKEN_VERSION`. This one needs neither; its
# version is `config::FIRST_SCHEDULED_NOTE_VERSION`, the first in which a
# schedule may declare `reset_on`, and no member here reads differently under it.
version: 11
name: dag-scope
members:
  monitor:
    kind: onejudge
    base_config: ./onejudge.base.yaml
    # The monitor role ships at the `orchestrator.yaml` path it was rewritten
    # into; the role it carries is named by the persona itself.
    persona: ../personas/orchestrator.yaml
    agent:
      oneharness_config: ./oneharness.orchestrator.toml
    # The host's message bus owns the judge side. The launcher substitutes the
    # run root; the host supplies ONEMESSAGEBUS_CONFIG with its codec binding.
    judge:
      # llmlint: ignore[contracts_have_one_source_or_a_drift_gate] This is one
      # invocation of the adopted bus's `serve` verb — a use of that CLI's
      # grammar, as a script's `git commit` is of git's, not a second statement
      # of it. The suite installs no bus binary and the bus library exposes no
      # parser to ask, so what this repository holds is the shape a launch
      # substitutes into (`tests/e2e/shipped.rs`); the flags are the bus's to
      # move, and a move shows where a host runs this graph.
      command: ["onemessagebus", "serve", "--codec", "onejudge", "--transport-dir", "${ONEPIPELINE_RUNS_DIR}/${ONEPIPELINE_RUN_ID}/channel", "surfaces"]
    mode: bypass
  check-in:
    kind: oneharness
    oneharness_config: ./oneharness.orchestrator.toml
    persona: ../personas/check-in.yaml
    # Every surface a planner reads restarts this clock, so a run that is
    # already reporting does not also get a pacemaker surface: `next` journals
    # `planner-surfaced`, and the graph follows the run's journal. The first
    # turn is at launch, as it was before the schema this needs; the engine
    # signals no member, so this filter is the only reset this clock has.
    schedule:
      every: 1800
      start_after: 0
      reset_on: {include: [{source: pipeline, kind: planner-surfaced}]}
