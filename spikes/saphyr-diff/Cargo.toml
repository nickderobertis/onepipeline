# Throwaway differential harness: the YAML crate this repository uses today
# (serde_norway) against serde-saphyr 1.3 and saphyr 0.2, over this repository's
# real documents and its own types. Spike only; never lands.
[package]
name = "saphyr-diff"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
onepipeline = { path = "../.." }
oneagentgraph = "0.5.6"
onevcs = "0.48.0"
onetaskgraph-core = "=0.4.0"
onetaskgraph-plugin-api = "=0.4.0"
onetaskgraph-local-md = "=0.4.0"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_norway = "0.9"
serde-saphyr = "1.3"
saphyr = "0.2"
serde_path_to_error = "0.1"
