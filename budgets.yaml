# The budgets this repository holds itself to, checked by `onebudgetspec check budgets.yaml`
# (`just budgets`).
#
# The engine is this repository's root Nx project, so the file sits at the root and its budgets
# are the whole repository's.
schema_version: 1
budgets:
  - id: stacked-spikes-stage-time
    measure: reported
    command: [node, scripts/stacked-spikes-budget.mjs]
    unit: seconds
    direction: max
    threshold: 60
    description: >-
      One harness and four preserve dependents, at plan concurrency 4 and identity
      capacity 4, from the run journal's first event to its last. The model turn
      is doubled because the shared harness adds a dispatch in series before
      the concurrent area spikes. The value is read from the existing test run,
      never re-measured; the test uses a subprocess agent double, not paid model turns.
  - id: linear-requests-per-writeback-settlement
    description: >-
      Measures the highest loopback Linear request count per settlement attempt after the first
      across at least five consecutive write-backs through the real worker. It protects a
      production Linear key which no check may reach.
    labels: [linear]
    measure: reported
    command: ["bash", "scripts/linear-writeback-budget.sh"]
    unit: requests
    direction: max
    threshold: 2
    timeout_seconds: 1800
  - id: settlement-readability-latency
    measure: reported
    command: [bash, scripts/settlement-latency-budget.sh]
    unit: milliseconds
    direction: max
    threshold: 1000
    timeout_seconds: 1800
    description: >-
      A dispatch's member-settled journal stamp to its node-settled journal stamp,
      measured by an unheld real subprocess journey. The Windows journey checks
      deterministically that a ready settlement waits on no poll timer; this
      retains its original 1000 ms latency bound as a gated cost figure.
  - id: stop-guard-unpublished-latency
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs]
    unit: seconds
    direction: max
    threshold: 0.2
    description: >-
      Warm native Stop verdict: the slowest none, owed or unreadable scenario's maximum
      of ten current-binary `stop-guard --format claude-code --unpublished` calls with
      Claude Code's stdin, after one priming call. Read from the full-workload journey's
      validated telemetry; this command times nothing. The user's design target, judged on
      this repository's CI runner.
      Recorded on onevcs 0.48.0, on 2026-10-12 on a shared
      20-core dispatch host at load1 46: 321.8 ms, the owed scenario's maximum (median
      129.4 ms), over this threshold on that host. On onevcs 0.47.0 the same journey
      recorded 169.7 ms and on 0.46.0 110.5 ms. Each carries the scoped launcher-filtered
      decision read (onevcs #356, first released in 0.45.0). This build links onevcs 0.56.2;
      the threshold was not re-measured on it.
  - id: stop-guard-unpublished-latency-cold
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --cold]
    unit: seconds
    direction: max
    threshold: 0.5
    description: >-
      Cold native Stop verdict: the same ten calls per scenario with every proof and
      index cache cleared before each, the slowest scenario's maximum. Read from the
      journey's telemetry. The user's design target for a cold cache.
      Recorded on onevcs 0.48.0, on 2026-10-12 on a shared
      20-core dispatch host at load1 46: 647.5 ms, the none scenario's maximum (median
      361.8 ms), over this threshold on that host. On onevcs 0.47.0 the same journey
      recorded 555.3 ms and on 0.46.0 299.1 ms. Each carries the scoped launcher-filtered
      decision read (onevcs #356, first released in 0.45.0). This build links onevcs 0.56.2;
      the threshold was not re-measured on it.
  - id: stop-guard-unpublished-latency-10x
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --scale, '10']
    unit: seconds
    direction: max
    threshold: 1.0
    description: >-
      Warm native Stop verdict at ten times the host-shaped workload: the slowest
      scenario's maximum of ten calls after one priming call. Read from the journey's
      telemetry. A temporary relaxation from the manager's 0.5 s design bound, by the
      user's ruling of 2026-10-11 to land now; a later gap-closing run owns the remaining
      10x warm cost. Recorded on onevcs 0.48.0, on 2026-10-12
      on a shared 20-core dispatch host at load1 50: 707.1 ms, the none scenario's maximum. On
      onevcs 0.47.0 the same journey recorded 724.2 ms (load1 66) and on 0.46.0 1,209.2 ms
      (owed, load1 31). Each carries the scoped launcher-filtered decision read (onevcs #356,
      first released in 0.45.0). This build links onevcs 0.56.2;
      the threshold was not re-measured on it.
  - id: stop-guard-unpublished-journey-time
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --journey-time]
    unit: seconds
    direction: max
    threshold: 180
    description: >-
      The full-workload stop-verdict journey's elapsed time, from empty fixture roots
      through both workloads' preparation, validation, every timed and separate counting
      call, priming, cache clears and cleanup. Read from the journey's telemetry.
  - id: host-view-time
    labels: [release-binary]
    measure: reported
    command: [node, scripts/host-view-budget.mjs]
    unit: milliseconds
    direction: max
    threshold: 100
    description: >-
      Wall clock of one `onepipeline host` process, spawn to exit, of the release binary CI's
      `install` job builds, over the generated 100-run fixture runs root at steady state, every
      ended run's journal unreadable to it. Each of five single reads is judged, so the value is
      the slowest; the median, the phase breakdown, the cold read and the 100/400/800-root
      scaling reads are its detail. Measured by `just host-view-budget` there, read from the
      record it leaves; `just budgets` leaves it out, as the gate builds no release binary.
  - id: review-round-github-quota
    measure: reported
    command: [bash, scripts/review-round-quota-budget.sh]
    unit: quota-units
    direction: max
    threshold: 45
    description: >-
      GraphQL points plus REST requests one busy review round spends across the two tokens it
      touches: the host's `gh` token and the plan store's board token. The round is ten stacked
      drafts, six new comments, two passes, two reworks, one decline, a person's merge and a
      readjustment, and six replies. Read from the telemetry the e2e tier's busy-round journey
      records over onevcs-testing's remote double, fake agents and a local Markdown store,
      because no check may spend the shared account's quota. Each ledger call is charged what
      the spikes measured on GitHub, each store task written 2 points, and each store read 1.
      The threshold is spike-quota-round-report's measured round of about 42, with a little room.
