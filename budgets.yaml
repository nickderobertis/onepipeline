# The budgets this repository holds itself to, checked by `onebudgetspec check budgets.yaml`
# (`just budgets`).
#
# The engine is this repository's root Nx project, so the file sits at the root and its budgets
# are the whole repository's.
schema_version: 1
budgets:
  - id: stacked-spikes-stage-time
    measure: reported
    command: [node, scripts/stacked-spikes-budget.mjs, target/budget-records/stacked-spikes-stage.json]
    unit: seconds
    direction: max
    threshold: 60
    description: >-
      One harness and four preserve dependents, at plan concurrency 4 and identity
      capacity 4, from the run journal's first event to its last. The model turn
      is doubled because the shared harness adds a dispatch in series before
      the concurrent area spikes. The value is read from the existing test run,
      never re-measured; the test uses a subprocess agent double, not paid model turns.
  - id: source-hold-store-operations-per-hour
    measure: reported
    command: [node, scripts/store-operations-budget.mjs, target/budget-records/store-operations/source-hold-store-operations-per-hour.json]
    unit: operations
    direction: max
    threshold: 5
    description: >-
      Store operations the engine's hold-and-re-read loop issues, over one hour after launch,
      to every private source nodes are held on, counted at the store seam; detail reports
      them per source and per held node, re-reads at a reset versus on backoff, the waits
      chosen and the unchanged fixed-interval figure. Workload: one run of a 20-task plan in a
      local Markdown source, 3 tasks each with one opaque edge to an item of a private source
      and 17 with none; the source answers rate limited for the whole hour, with a reset 30
      minutes out during the first half hour and none during the second; the hour is
      compressed by ONEPIPELINE_SOURCE_POLL_SECONDS=1, so 60 poll intervals stand for 3,600 s.
      Arithmetic: launch excluded, one re-read at the provider reset after 30 minutes, then
      backoff re-reads 1, 3, 7 and 15 minutes later, each pass stopping at its first
      rate-limited answer: 1 + 4 = 5; the next falls after the hour. Read from the held-hour
      journey's telemetry; each backend's requests per operation are onetaskgraph's to bound
      (its per-dependency-read budgets).
  - id: store-operations-per-dispatch
    measure: reported
    command: [node, scripts/store-operations-budget.mjs, target/budget-records/store-operations/store-operations-per-dispatch.json]
    unit: operations
    direction: max
    threshold: 1
    description: >-
      Store operations the engine issues to dispatch one node, from the node becoming ready to
      its dispatched process starting, its write-back projection included, the largest over a
      run's dispatches; detail reports them by kind, and each write-back attempt's shared
      end-command as per-attempt overhead attributed to no dispatch, by the manager's ruling.
      Workload: one run of a 20-task plan in a local Markdown source with no holds, each of its
      20 dispatches counted. Design requirement from the user: one complete store operation
      per dispatch, all projection fields batched and redundant reads served from held state.
      Read from the 20-task journey's telemetry; each backend's requests per status write are
      onetaskgraph's to bound.
  - id: store-operations-per-settlement
    measure: reported
    command: [node, scripts/store-operations-budget.mjs, target/budget-records/store-operations/store-operations-per-settlement.json]
    unit: operations
    direction: max
    threshold: 1
    description: >-
      Store operations the engine issues to write back one settlement including the run's
      first, the largest over the attempts; detail reports them by kind including the first
      settlement's figure, and each write-back attempt's shared end-command as per-attempt
      overhead attributed to no settlement, by the manager's ruling. Workload: five
      consecutive settlement write-backs including the first through the real write-back
      worker, in one run of a local Markdown plan. Design requirement from the user: one
      complete store operation per settlement, the first included. Read from the 20-task
      journey's telemetry; each backend's requests per settlement update are onetaskgraph's to
      bound.
  - id: settlement-readability-latency
    measure: reported
    command: [just, settlement-latency-budget]
    unit: milliseconds
    direction: max
    threshold: 1000
    timeout_seconds: 1800
    description: >-
      A dispatch's member-settled journal stamp to its node-settled journal stamp,
      measured by an unheld real subprocess journey. The Windows journey checks
      deterministically that a ready settlement waits on no poll timer; this
      retains its original 1000 ms latency bound as a gated cost figure.
  - id: stop-guard-unpublished-latency
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json]
    unit: seconds
    direction: max
    threshold: 0.2
    description: >-
      Warm native Stop verdict: the slowest none, owed or unreadable scenario's median
      of ten current-binary `stop-guard --format claude-code --unpublished` calls with
      Claude Code's stdin, after one priming call. Read from the full-workload journey's
      validated telemetry; this command times nothing. A single outlying call does not
      determine the median. The user's design target, judged on
      this repository's CI runner.
      Recorded on onevcs 0.48.0, on 2026-10-12 on a shared
      20-core dispatch host at load1 46: 321.8 ms, the owed scenario's maximum (median
      129.4 ms), over this threshold on that host. On onevcs 0.47.0 the same journey
      recorded 169.7 ms and on 0.46.0 110.5 ms. Each carries the scoped launcher-filtered
      decision read (onevcs #356, first released in 0.45.0). This build links onevcs 0.56.2;
      the threshold was not re-measured on it.
  - id: stop-guard-unpublished-latency-cold
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json, --cold]
    unit: seconds
    direction: max
    threshold: 0.5
    description: >-
      Cold native Stop verdict: the same ten calls per scenario with every proof and
      index cache cleared before each, the slowest scenario's median. Read from the
      journey's telemetry. A single outlying call does not determine the median.
      The user's design target for a cold cache.
      Recorded on onevcs 0.48.0, on 2026-10-12 on a shared
      20-core dispatch host at load1 46: 647.5 ms, the none scenario's maximum (median
      361.8 ms), over this threshold on that host. On onevcs 0.47.0 the same journey
      recorded 555.3 ms and on 0.46.0 299.1 ms. Each carries the scoped launcher-filtered
      decision read (onevcs #356, first released in 0.45.0). This build links onevcs 0.56.2;
      the threshold was not re-measured on it.
  - id: stop-guard-unpublished-latency-10x
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json, --scale, '10']
    unit: seconds
    direction: max
    threshold: 1.0
    description: >-
      Warm native Stop verdict at ten times the host-shaped workload: the slowest
      scenario's median of ten calls after one priming call. Read from the journey's
      telemetry. A single outlying call does not determine the median. A temporary relaxation
      from the manager's 0.5 s design bound, by the
      user's ruling of 2026-10-11 to land now; a later gap-closing run owns the remaining
      10x warm cost. Recorded on onevcs 0.48.0, on 2026-10-12
      on a shared 20-core dispatch host at load1 50: 707.1 ms, the none scenario's maximum. On
      onevcs 0.47.0 the same journey recorded 724.2 ms (load1 66) and on 0.46.0 1,209.2 ms
      (owed, load1 31). Each carries the scoped launcher-filtered decision read (onevcs #356,
      first released in 0.45.0). This build links onevcs 0.56.2;
      the threshold was not re-measured on it.
  - id: unpublished-host-latency
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json, --host-shaped, unpublished-host]
    unit: seconds
    direction: max
    threshold: 0.35
    description: >-
      Host-wide unpublished listing, decisions recorded: wall time of one current-binary
      `onepipeline unpublished --host --format json` process, spawn to exit, with this
      host's acknowledgements directory, the median of ten calls.
      Over `onevcs_testing::recovery::HOST`: 20 identities, 45 checkouts, 120 preserved unlanded branches across 11 identities (68 in the largest), 3 in flight, one checkout of 8,500 refs, 2 branches each changing 30,000 paths of about 100 bytes (1 reaching git's comparison), 20 dirty checkouts, 656 loose commits, 10 acknowledged branches; every branch's decision recorded by onevcs, then `age_host` applied: the 20 branches one session owns moved, and six identities' bases gained 3, 8, 25, 40, 300 and 600 commits, the 25-, 300- and 600-commit gains landing 1, 3 and 2 recorded branches. Each of the ten calls starts, outside its timing, from `AgedHost::restore` and `AgedHost::verify` (and the acknowledgements file restored), and its answer is asserted after it against the classes the fixture declares, so no sample reads a state an earlier call refreshed. The measured session is the fixture's launcher, the label `onepipeline` selects a session's rows by, so its listing is every launcher-labelled row of the host — the 20 moved branches and both 30,000-path branches among them — which is heavier than the 20 rows the fixture's `session` label names (manager ruling, 2026-11-09). Detail states the cold first read (the first listing of the aged state, restored and verified;
      stated, not budgeted), the branches re-derived, the onevcs read, the acknowledgement
      read, rendering, the slowest call and the git executions of a separate counting call.
      Design: the user's 1 s target on this host under load, divided by onepipeline's measured host-to-runner ratio of 2.8 (`just stop-verdict-journeys` on commit 78c82f7a at load 52-65 against CI run 42445365190 attempt 2: 2.67 warm, 2.89 cold, 2.93 at 10x). No measurement reaches it; the target is an escalated exception awaiting the user. Read from the full-workload journey's validated telemetry; this command times nothing. A single outlying call does not determine the median. The user's design target, judged on this repository's CI runner. The spike (report unpublished-speed-2026-11-08-spike-unpublished-costs-report)
      measured the record prototype at 5.9 s with nothing moved (load 36), 10.1 to 18.7 s aged
      (load 33 to 46), 4.7 s over the host-shaped fixture (load 41), and cold 29.6 s at load 13.5.
  - id: unpublished-acknowledge-latency
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json, --host-shaped, acknowledge]
    unit: seconds
    direction: max
    threshold: 0.35
    description: >-
      Acknowledging one preserved branch: wall time of one current-binary `onepipeline
      unpublished --acknowledge <branch> --reason <text> --session <session>
      --acknowledgements <dir>` process, spawn to exit, its session listing included; the
      median of ten calls each acknowledging a different branch, one of them a branch
      changing 30,000 paths whose comparison reaches git. After each call the receipt, the
      file and the listing's rows are asserted.
      Over `onevcs_testing::recovery::HOST`: 20 identities, 45 checkouts, 120 preserved unlanded branches across 11 identities (68 in the largest), 3 in flight, one checkout of 8,500 refs, 2 branches each changing 30,000 paths of about 100 bytes (1 reaching git's comparison), 20 dirty checkouts, 656 loose commits, 10 acknowledged branches; every branch's decision recorded by onevcs, then `age_host` applied: the 20 branches one session owns moved, and six identities' bases gained 3, 8, 25, 40, 300 and 600 commits, the 25-, 300- and 600-commit gains landing 1, 3 and 2 recorded branches. Each of the ten calls starts, outside its timing, from `AgedHost::restore` and `AgedHost::verify` (and the acknowledgements file restored), and its answer is asserted after it against the classes the fixture declares, so no sample reads a state an earlier call refreshed. The measured session is the fixture's launcher, the label `onepipeline` selects a session's rows by, so its listing is every launcher-labelled row of the host — the 20 moved branches and both 30,000-path branches among them — which is heavier than the 20 rows the fixture's `session` label names (manager ruling, 2026-11-09). Detail states the branch read from onevcs, the write, the listing and the
      slowest call. Design: the user's 1 s target on this host under load, divided by onepipeline's measured host-to-runner ratio of 2.8 (`just stop-verdict-journeys` on commit 78c82f7a at load 52-65 against CI run 42445365190 attempt 2: 2.67 warm, 2.89 cold, 2.93 at 10x). No measurement reaches it; the target is an escalated exception awaiting the user. Read from the full-workload journey's validated telemetry; this command times nothing. A single outlying call does not determine the median. The user's design target, judged on this repository's CI runner. The spike measured 29.4 s unmodified (load 17), 8.0 s with the
      record (load 44) and 42.6 s over the host-shaped fixture (load 37), before the branch
      filter this build reads with.
  - id: stop-guard-unpublished-latency-host
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json, --host-shaped, stop-guard]
    unit: seconds
    direction: max
    threshold: 0.35
    description: >-
      Stop verdict at this host's shape: wall time of one current-binary `onepipeline
      stop-guard --format claude-code --unpublished` process with Claude Code's stdin, the
      slowest of the none, owed and unreadable scenarios' medians of ten calls; the verdict
      and exit status are asserted after each call.
      Over `onevcs_testing::recovery::HOST`: 20 identities, 45 checkouts, 120 preserved unlanded branches across 11 identities (68 in the largest), 3 in flight, one checkout of 8,500 refs, 2 branches each changing 30,000 paths of about 100 bytes (1 reaching git's comparison), 20 dirty checkouts, 656 loose commits, 10 acknowledged branches; every branch's decision recorded by onevcs, then `age_host` applied: the 20 branches one session owns moved, and six identities' bases gained 3, 8, 25, 40, 300 and 600 commits, the 25-, 300- and 600-commit gains landing 1, 3 and 2 recorded branches. Each of the ten calls starts, outside its timing, from `AgedHost::restore` and `AgedHost::verify` (and the acknowledgements file restored), and its answer is asserted after it against the classes the fixture declares, so no sample reads a state an earlier call refreshed. The measured session is the fixture's launcher, the label `onepipeline` selects a session's rows by, so its listing is every launcher-labelled row of the host — the 20 moved branches and both 30,000-path branches among them — which is heavier than the 20 rows the fixture's `session` label names (manager ruling, 2026-11-09). Detail states the session read, the unwatched check, the slowest call and the
      git executions of a separate counting call. Design: the user's 1 s target on this host under load, divided by onepipeline's measured host-to-runner ratio of 2.8 (`just stop-verdict-journeys` on commit 78c82f7a at load 52-65 against CI run 42445365190 attempt 2: 2.67 warm, 2.89 cold, 2.93 at 10x). No measurement reaches it; the target is an escalated exception awaiting the user. Read from the full-workload journey's validated telemetry; this command times nothing. A single outlying call does not determine the median. The user's design target, judged on this repository's CI runner. The spike measured 1.2 to 1.4 s
      timed at load 31 to 71, 2.2 s with the record's write path at load 50, and 0.45 s over
      the host-shaped fixture (load 35).
  - id: stop-guard-unpublished-journey-time
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --record, target/budget-records/stop-guard-unpublished.json, --journey-time]
    unit: seconds
    direction: max
    threshold: 180
    description: >-
      The full-workload stop-verdict journey's elapsed time, from empty fixture roots
      through every workload's preparation (the two scales and the host-shaped one),
      validation, every timed and separate counting call, priming, cache clears and
      cleanup. Read from the journey's telemetry.
  - id: host-view-time
    labels: [release-binary]
    measure: reported
    command: [node, scripts/host-view-budget.mjs, target/budget-records/host-view.json]
    unit: milliseconds
    direction: max
    threshold: 100
    description: >-
      Wall clock of one `onepipeline host` process, spawn to exit, of the release binary CI's
      `install` job builds, over the generated 100-run fixture runs root at steady state, every
      ended run's journal unreadable to it. The value is the median of five single reads: the
      job runs other targets beside it, and a read's CPU time holds steady under that load
      while its wait for a CPU does not (one read of test-linux run 43002330270 took 120.8 ms
      at load 8.4 on 4 cores, its siblings 70.4 to 85.1, where an idle runner reads about
      21 ms each), so the slowest read judges the load and the median the view. The slowest
      read, the phase breakdown, the cold read and the 100/400/800-root scaling reads are its
      detail. Measured by `just host-view-budget` there, read from the
      record it leaves; `just budgets` leaves it out, as the gate builds no release binary.
  - id: review-round-github-quota
    measure: reported
    command: [bash, scripts/review-round-quota-budget.sh, target/budget-records/review-round-quota.json]
    unit: quota-units
    direction: max
    threshold: 175
    description: >-
      GraphQL points plus REST requests one busy review round spends across the two tokens it
      touches: the host's `gh` token and the plan store's board token. The round is ten stacked
      drafts, six new comments, two passes, two reworks, one decline, a person's merge and a
      readjustment, and six replies. Read from the telemetry the e2e tier's busy-round journey
      records over onevcs-testing's remote double, fake agents and a local Markdown store,
      because no check may spend the shared account's quota. Each ledger call is charged what
      the spikes measured on GitHub, each store task written 2 points, and each store read 1.
      The threshold is this journey's measured round, 152 to 162 over eight runs on 2026-10-18
      and 2026-10-19 (CI 156 at #935's head, 160 on main at 645ca97f and 162 at #1015; locally
      152, 152, 154, 158, 162), plus a margin: 175 is the measured upper bound 162 plus 13 units,
      about 8% of it. The gh token is 54 in every run: 30 GraphQL
      points (both passes' review reads 11, the decline's comment read 1, sixteen standings
      reads — the reworks' and the readjustment's placement reads and one per retarget — 16, two
      open-change lookups 2) and 24
      REST requests (six reply posts, two retargets, sixteen visibility probes). The board token
      is 98 to 108, as concurrency groups the publications: each publication's fence written
      and cleared on the project, each command's claim written and released, about eleven task
      writes and six claim reads. The 45 it replaces was arithmetic of 2026-10-10 over a design
      without the boundary's visibility probes (#852), the driver's claim (#862), the placement
      read (#916) or the publication fence (#965); the fence's writes alone are over 45.
  - id: check-visibility-github-quota
    measure: reported
    command: [bash, scripts/check-visibility-quota-budget.sh, target/budget-records/check-visibility-quota.json]
    unit: quota-units
    direction: max
    threshold: 250
    description: >-
      GitHub quota for following checks and release holds: GraphQL points plus REST requests one
      realistic run spends on the host's gh token following its published change requests'
      checks after publication and reading what holds its awaited releases; the reporter's
      detail breaks it into follow reads and holdup reads, each with its call count and points.
      Workload: one run of about 4 hours publishing 12 change requests across 3 repositories,
      6 of which still have 3 non-required checks running for 20 minutes after their required
      checks settle, and 2 nodes held 3 hours on one automated release whose release change
      request has a failing required check. Read from the telemetry the e2e tier's
      check-visibility workload journey records over onevcs-testing's remote double, which
      answers and charges every follow read, and recorded GitHub responses replayed at onevcs's
      `ONEVCS_GH` seam, which answer every holdup query and report its `rateLimit.cost`; the
      journey runs every interval and duration divided by 1000, so the counts are what the
      engine's own cadence and sharing produce. Basis: arithmetic from onevcs's stated costs — a
      batched follow read is 1 GraphQL point for up to 50 change requests and no REST request,
      so 6 changes x 20 one-minute reads with no two overlapping is 120 points; a holdup read is
      at most 2 queries of 1 point, every 10 minutes and shared by both held nodes, 18 x 2 = 36;
      156 in all, and 250 leaves room for the first reads at publication and at the run's end.
  # The CI, CD and local-gate budgets. The nine labelled `release-tail` are measured after a
  # release, from GitHub's own records of the runs it carried, by the last step of release.yml's
  # `publish` (`onebudgetspec check budgets.yaml --label release-tail`), reporting only;
  # `onepipeline-gate-time`, labelled `host-variable`, is checked by `just gate` as a warning.
  # Every other check of this file excludes both labels. Each reads telemetry and measures
  # nothing fresh. The CD and release-read figures leave out the main-push Rust cache warmer
  # (`--exclude-workflow "Rust cache warm"`), which builds caches, and `budgets`' push run
  # (`--exclude-workflow CI`), which records budget history; neither delivers anything to a
  # release.
  #
  # Workload: one release carrying 2.6 to 2.8 merged PRs, each PR's last commit running the 4 CI
  # jobs; 80 releases and 224 merged PRs in 30 days (2026-09-15 to 10-15).
  #
  # Threshold: the longest job this change's own hosted run measured, test-windows at 8,905 s
  # (run 41298787095, 2026-11-01), with 1,895 s (21%) of headroom: 3 hours, test-linux's
  # timeout-minutes, which every test job's timeout meets or exceeds while the user pursues the
  # 30-minute line (ruled 2026-10-31).
  - id: onepipeline-ci-check-time
    description: >-
      The longest counted job of each pull request's last-commit CI runs, over the pull requests
      one release carries, from GitHub's job timestamps. It protects every contributor's
      turnaround, because one slow check holds every change behind it. On a pull request's own run
      it reports that run: the longest finished job of its five, breaking down by job, read once when
      the budgets job runs with four jobs finished and itself in progress.
    labels: [release-tail]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, longest-job, --stage, pr]
    unit: seconds
    direction: max
    threshold: 10800
    timeout_seconds: 300
  # Workload: one release's 6 CD jobs — release-plz, build-linux, build-linux-arm64, build-macos,
  # build-windows and publish, publish timed up to the tail's moment; 80 releases and 224 merged
  # PRs in 30 days (2026-09-15 to 10-15).
  - id: onepipeline-cd-job-time
    description: >-
      The longest counted job of one release's CD runs — release-plz's run at the release commit
      and the Release run, publish included up to the tail's moment. It protects the time a
      release takes, a slow job being the actionable unit inside the release cycle.
    labels: [release-tail, not-measured-on-pr]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, longest-job, --stage, cd, --exclude-workflow, "Rust cache warm", --exclude-workflow, CI]
    unit: seconds
    direction: max
    threshold: 1800
    timeout_seconds: 300
  # Workload: one release carrying 2.6 to 2.8 merged PRs, each PR's last commit running the 4 CI
  # jobs; 80 releases and 224 merged PRs in 30 days (2026-09-15 to 10-15).
  - id: onepipeline-release-cycle-time
    description: >-
      Per pull request one release carries whose merge changes a published artifact path, its last
      commit's checks plus its merge to the end of publish; the maximum over those pull requests. It protects how soon a merged change
      reaches the people who install it.
    labels: [release-tail, not-measured-on-pr]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, release-cycle-time, --published-paths, .github/release-published-paths]
    unit: seconds
    direction: max
    threshold: 5400
    timeout_seconds: 300
  # Workload: one release carrying 2.6 to 2.8 merged PRs, each PR's last commit running the 5 CI
  # jobs (the 4 of that window plus budgets); 80 releases and 224 merged PRs in 30 days
  # (2026-09-15 to 10-15).
  - id: onepipeline-ci-job-count
    description: >-
      The most counted jobs any pull request of one release ran at its last commit, over every
      workflow its pull_request event started. It protects this repository's share of the
      account-wide 20-job concurrency limit: lint, one test job per platform and budgets. On a pull
      request's own run it reports that run: its jobs, breaking down by job name, read once when the
      budgets job runs.
    labels: [release-tail]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, job-count, --stage, pr]
    unit: jobs
    direction: max
    threshold: 5
    timeout_seconds: 300
  # Workload: one release's 6 CD jobs — release-plz, build-linux, build-linux-arm64, build-macos,
  # build-windows and publish, publish itself included as the job running the tail; 80 releases
  # and 224 merged PRs in 30 days (2026-09-15 to 10-15).
  - id: onepipeline-cd-job-count
    description: >-
      The counted jobs of one release's CD runs, publish included as the job running the tail. It
      protects this repository's CD share of the account-wide 20-job concurrency limit:
      release-plz, four build jobs and publish.
    labels: [release-tail, not-measured-on-pr]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, job-count, --stage, cd, --exclude-workflow, "Rust cache warm", --exclude-workflow, CI]
    unit: jobs
    direction: max
    threshold: 6
    timeout_seconds: 300
  # Workload: one release of the six-job CD shape, its release commit carrying release-plz's push
  # run and the Release run, whose pull request heads each run the one CI workflow; one release
  # carrying 2.6 to 2.8 merged PRs, each PR's last commit running the 4 CI jobs; 80 releases and
  # 224 merged PRs in 30 days (2026-09-15 to 10-15).
  - id: onepipeline-release-read-requests
    description: >-
      The REST requests the release's own reads cost — the releases listing, the comparison, the
      closed-pull-request page, the runs at the release commit and the jobs of its CD runs —
      summed from onevcs's answers. It protects the tail's GitHub reads from growing with this
      repository's CD shape, whatever number of pull requests a release carries.
    labels: [release-tail, not-measured-on-pr]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, release-read-requests, --exclude-workflow, "Rust cache warm", --exclude-workflow, CI]
    unit: requests
    direction: max
    threshold: 6
    timeout_seconds: 300
  # Workload: one release of the six-job CD shape whose pull request heads each run the one CI
  # workflow; one release carrying 2.6 to 2.8 merged PRs, each PR's last commit running the 4 CI
  # jobs; 80 releases and 224 merged PRs in 30 days (2026-09-15 to 10-15).
  - id: onepipeline-pr-read-requests
    description: >-
      The most REST requests any one pull request of the release needed — its runs at head and the
      jobs of each CI run there — from onevcs's answers. It protects the reads each pull request
      costs from growing with the workflows a pull request starts.
    labels: [release-tail, not-measured-on-pr]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, pr-read-requests]
    unit: requests
    direction: max
    threshold: 2
    timeout_seconds: 300
  # Workload: one `just gate` run on a development host such as a 14-core aarch64 machine, with
  # the Nx cache as that run finds it.
  - id: onepipeline-gate-time
    description: >-
      The wall clock of one `just gate` run on a development machine, from the start and end the
      recipe records on that run. It holds the local gate to the line each CI job is held to, as a
      warning, since a development machine's timing varies too much to refuse on.
    labels: [host-variable, not-measured-on-pr]
    measure: reported
    command: [node, scripts/gate-time-budget.mjs]
    unit: seconds
    direction: max
    threshold: 1800
    timeout_seconds: 30

  # Workload: the newest release with evidence when the command runs, carrying 1 to 9 merged
  # pull requests at 3 pushes each and 4 CI jobs per push, with 542 minutes at p90 from
  # promotion to the release pull request. Each coverage tier replays its LCOV report. Count every
  # current cacheable execution and its preceding failed/throttled attempts; evidence that
  # ordinary conditions removed is counted as unavailable, and the figure is taken over what
  # is measurable.
  - id: onepipeline-nx-cache-use
    description: >-
      onepipeline: proven results replay when needed. Remote hits as a percentage of
      attempt-qualified cacheable task/OS/hash executions, excluding local hits, with
      `base_moved` tasks counted as misses. Report misses by class (throttled, failed,
      evicted, never_promoted, base_moved), attempts whose evidence is unavailable, receipt
      ages and requests. The 100 percent design target is revisited after real release-tail
      observations; over 30 days to 2026-11-06 a non-release merge moved the base under 66
      of 165 pull requests, so a reading under 100 is expected rather than alarming.
    labels: [release-tail, not-measured-on-pr]
    measure: reported
    command: [bash, scripts/actions-budget-figures.sh, cache-use]
    unit: percent
    direction: min
    threshold: 100
    timeout_seconds: 300

  # Workload: one reading of this repository's real listing as it stands when the command
  # runs, about 590 entries; one request per 100 entries over every page. The target is sized
  # for one warm run saving four families beside the previous copy of each, 542 minutes at p90
  # and 1,416 at most from promotion to release pull request, and at most 22 pushes a day at
  # about 1 MB of results each.
  #
  # Threshold, by arithmetic from spike-cache-eviction's 8-hour watch to 2026-11-07 and warm
  # logs since 2026-11-01: a run must save beside the old copies under the line, so
  # 2C + g + O + R <= L, with L 10.737, O 0.171, R 0.05 and g/C 2.057/9.495 from each family's
  # largest growth. So C <= 4.74 GB and the target is 10.737 - 0.171 - 4.74 = 5.82 GB. Each warm
  # workflow's concurrency group holds it to one run at a time, and each leg's cleanup runs
  # before its save and keeps the newest copy, so a family holds at most two copies at any
  # moment; that bound is 2C + g. Results count in the figure, at most about 0.154 GB at 22 MB
  # a day over GitHub's 7-day idle limit, so 5.82 stays above what the arithmetic needs then
  # (5.71). The families named are exactly those the warm legs' cleanup steps name, which
  # .github/ci-shape/ci-shape.test.mjs holds.
  - id: onepipeline-cache-headroom
    description: >-
      onepipeline: room left for test results. Room left for one warm run's saves and test
      results: GitHub's stated Actions-cache allowance, 10 GiB, minus the bytes of every entry,
      test results (`nx-cache-*`) included, read over every page of the listing when the command
      runs, in gigabytes of 10^9 bytes and negative when those bytes are over the line. A family
      the command names counts only its newest entry, because a working cleanup leaves the
      previous copy until the next push to `main`; when a named family holds more than two
      entries the figure is 0, which reads over, because two is the most a working cleanup
      leaves. It shows the cause of `onepipeline-nx-cache-use` and
      `onepipeline-release-cycle-time` falling before results are lost, and names the family
      responsible. Detail: the allowance, non-result bytes per key family, older copies' bytes,
      any family over two entries, result entries and bytes, the oldest result's age, the
      requests the read made and the lowest rate-limit remaining.
    labels: [release-tail]
    measure: reported
    command:
      - bash
      - scripts/actions-budget-figures.sh
      - cache-headroom
      - --family
      - v0-rust-test-linux-Linux-x64-
      - --family
      - v0-rust-test-windows-Windows_NT-x64-
      - --family
      - v0-rust-test-macos-Darwin-arm64-
      - --family
      - ci-capture-Linux-X64-
      - --family
      - bootstrap-tools-Linux-X64-
      - --family
      - bootstrap-tools-Windows-X64-
      - --family
      - bootstrap-tools-macOS-ARM64-
      - --family
      - v0-rust-release-plz-Linux-x64-
    unit: gigabytes
    direction: min
    threshold: 5.82
    timeout_seconds: 60
