# The budgets this repository holds itself to, checked by `onebudgetspec check budgets.yaml`
# (`just budgets`).
#
# The engine is this repository's root Nx project, so the file sits at the root and its budgets
# are the whole repository's.
schema_version: 1
budgets:
  - id: stacked-spikes-stage-time
    measure: reported
    command: [node, scripts/stacked-spikes-budget.mjs]
    unit: seconds
    direction: max
    threshold: 60
    description: >-
      One harness and four preserve dependents, at plan concurrency 4 and identity
      capacity 4, from the run journal's first event to its last. The model turn
      is doubled because the shared harness adds a dispatch in series before
      the concurrent area spikes. The value is read from the existing test run,
      never re-measured; the test uses a subprocess agent double, not paid model turns.
  - id: linear-requests-per-writeback-settlement
    description: >-
      Measures the highest loopback Linear request count per settlement attempt after the first
      across at least five consecutive write-backs through the real worker. It protects a
      production Linear key which no check may reach.
    labels: [linear]
    measure: reported
    command: ["bash", "scripts/linear-writeback-budget.sh"]
    unit: requests
    direction: max
    threshold: 2
    timeout_seconds: 1800
  - id: stop-guard-unpublished-latency
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs]
    unit: seconds
    direction: max
    threshold: 0.2
    description: >-
      Warm native Stop verdict: the slowest none, owed or unreadable scenario's maximum
      of ten current-binary `stop-guard --format claude-code --unpublished` calls with
      Claude Code's stdin, after one priming call. Read from the full-workload journey's
      validated telemetry; this command times nothing.
  - id: stop-guard-unpublished-latency-cold
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --cold]
    unit: seconds
    direction: max
    threshold: 0.5
    description: >-
      Cold native Stop verdict: the same ten calls per scenario with every proof and
      index cache cleared before each, the slowest scenario's maximum. Read from the
      journey's telemetry.
  - id: stop-guard-unpublished-latency-10x
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --scale, '10']
    unit: seconds
    direction: max
    threshold: 0.5
    description: >-
      Warm native Stop verdict at ten times the host-shaped workload: the slowest
      scenario's maximum of ten calls after one priming call. Read from the journey's
      telemetry.
  - id: stop-guard-unpublished-journey-time
    measure: reported
    command: [node, scripts/stop-guard-unpublished-budget.mjs, --journey-time]
    unit: seconds
    direction: max
    threshold: 180
    description: >-
      The full-workload stop-verdict journey's elapsed time, from empty fixture roots
      through both workloads' preparation, validation, every timed and separate counting
      call, priming, cache clears and cleanup. Read from the journey's telemetry.
