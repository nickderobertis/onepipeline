schema_version: 1
budgets:
  - id: onepipeline-macos-jobs-per-run
    measure: reported
    command: [bash, -c, "cd .. && exec node .github/macos-budget.mjs --metric jobs-per-run --telemetry .github/.telemetry/macos-policy.json"]
    unit: jobs
    direction: max
    threshold: 1
    description: >-
      Maximum Mac runner job instances in a resolved workflow run, including matrices and
      reusable calls, across the single-push lifecycle and a run by hand.
      inner_measure_reason: one run can occupy several shared Mac slots even when the
      lifecycle run count stays within its bound. Separate ceilings constrain both slot occupancy
      and lifecycle fan-out. Telemetry only; no host label. The brief asks for both a
      per-run and a per-change ceiling, and the manager approved keeping them as separate budgets.
  - id: onepipeline-macos-runs-per-change
    measure: reported
    command: [bash, -c, "cd .. && exec node .github/macos-budget.mjs --metric runs-per-change --telemetry .github/.telemetry/macos-policy.json"]
    unit: runs
    direction: max
    threshold: 4
    description: >-
      Four Mac-spending runs: the ordinary pull request, its main-push build-only warmer,
      the release build, and the release pull request as the fourth run. The release PR now
      runs the Mac job and replays its proven quick tiers from the shared cache. Its added
      run and the ceiling of four stand only with the demonstrated replay; without that
      evidence the release-PR omission and the former ceiling of three both stay. The
      main-push warmer remains skipped when the push merges a release pull request.
      Maximum distinct Mac-spending workflow runs over one ordinary PR push, its base merge,
      optional semantic release PR and merge, release build and downstream smoke triggers.
      Twelve event classes, three diff classes, same-repository/fork ownership and all publish
      combinations. The lifecycle ceiling is separate from jobs/run because several sequential
      workflows can each occupy only one slot and still exceed the lifecycle allowance.
      Explicit manual diagnostics excluded. Telemetry only; no host label. The brief asks for both a
      per-run and a per-change ceiling, and the manager approved keeping them as separate budgets.
