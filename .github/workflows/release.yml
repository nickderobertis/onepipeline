name: Release

# Build, test-install, publish and verify everything a published GitHub Release
# ships, one platform per job, then the platform-independent rest:
#
#   * build-linux   — x86_64-unknown-linux-gnu
#   * build-macos   — aarch64-apple-darwin (Intel macOS is not built)
#   * build-windows — x86_64-pc-windows-msvc
#   * publish       — the crate and the npm launcher, once every platform is out
#
# Each build job builds its targets once, packages the archive, the wheel and
# the npm platform package from that one binary, test-installs those exact
# files, publishes them (the Release assets, PyPI, npm), and then installs what
# the registries serve on its own OS and runs it. Every step is a phase of its
# platform's recipe — `just release-<platform> build|publish|verify` — so a
# release and a developer run the same scripts/release.py, and `just
# release-<platform> plan` lists everything a job publishes without building it.
#
# `publish` needs all three. It refuses a lock that links an engine twice,
# records the linked engines in the notes, confirms every registry serves every
# platform, publishes the crate and the launcher, installs both, and records the
# outcome. A failed build job leaves the platforms that built published and the
# platform-independent artifacts unpublished until it is re-run: re-running the
# failed job and then `publish` finishes the release, and each upload skips what
# a registry already serves.
#
# The Release is what fires this: release-plz (see release-plz.yml) computes the
# version, writes the changelog and manifests, tags `vX.Y.Z`, and cuts the
# Release, with a PAT, because a Release created by the default GITHUB_TOKEN
# triggers nothing. Creating a Release by hand is the supported fallback; the
# tree it names was gated by the pull requests that reached it, and this
# workflow refuses a tag that does not name Cargo.toml's version.
#
# The version is never written here: every artifact takes it from Cargo.toml
# (maturin via `dynamic = ["version"]`, npm via scripts/npm-build.mjs), so
# release-plz stays the single version driver.
#
# PyPI and npm publish only while the PYPI_PUBLISH / NPM_PUBLISH repository
# variables are 'true' — the operator's switch, so a fork does not publish — and
# a registry switched on with an empty token is refused before anything builds.
# The crate publishes while CARGO_REGISTRY_TOKEN is set.

on:
  release:
    types: [published]

# Nothing by default: each job asks for what it writes.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
  NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
      verified: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build, package and test-install the Linux artifacts
        run: just release-linux build
      - name: Publish the Linux artifacts
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-linux publish
      - name: Install the Linux artifacts from the registries and run them
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release-linux verify

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
      verified: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the packager and the Rust target
        run: |
          just nx run onepipeline-npm:bootstrap
          uv tool dir --bin >> "$GITHUB_PATH"
          rustup target add aarch64-apple-darwin
      - name: Build, package and test-install the macOS artifacts
        run: just release-macos build
      - name: Publish the macOS artifacts
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-macos publish
      - name: Install the macOS artifacts from the registries and run them
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release-macos verify

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outcome }}
      verified: ${{ steps.verify.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the packager and the Rust target
        run: |
          just nx run onepipeline-npm:bootstrap
          uv tool dir --bin >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-msvc
      - name: Build, package and test-install the Windows artifacts
        run: just release-windows build
      - name: Publish the Windows artifacts
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just release-windows publish
      - name: Install the Windows artifacts from the registries and run them
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just release-windows verify

  # Runs when a build job failed too, so the outcome is recorded either way; its
  # publish step runs only when every build job succeeded. Its last step is the
  # outcome record; the release's budget tail is appended after it.
  publish:
    needs: [build-linux, build-macos, build-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Publish the platform-independent artifacts
        if: >-
          ${{ needs.build-linux.result == 'success' && needs.build-macos.result == 'success'
          && needs.build-windows.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: just release-publish publish
      # What this release did, as an artifact rather than as a conclusion
      # somebody reconstructs from job squares. README.md's "Release outcome"
      # documents it. `always()`: a record that only exists when everything
      # worked answers the one question nobody needs to ask.
      - name: Record the release outcome
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          LINUX_PUBLISHED: ${{ needs.build-linux.outputs.published }}
          LINUX_VERIFIED: ${{ needs.build-linux.outputs.verified }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          MACOS_PUBLISHED: ${{ needs.build-macos.outputs.published }}
          MACOS_VERIFIED: ${{ needs.build-macos.outputs.verified }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          WINDOWS_PUBLISHED: ${{ needs.build-windows.outputs.published }}
          WINDOWS_VERIFIED: ${{ needs.build-windows.outputs.verified }}
        run: just release-outcome
