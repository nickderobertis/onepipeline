name: CI

# Pull requests, and a push to main for two jobs: `budgets`, which records that
# commit's results as the history pull requests compare with, and `timed`, which
# times the release binary and checks every budget labelled `not-measured-on-pr`
# that a project's `timed` target owns, so a figure over its threshold is a red
# status on the one squash-merged pull request that commit is. No push to main
# re-runs the four pull-request jobs: branch protection does not require a branch
# to be up to date, and `rust-cache-warm.yml`'s build on each push to main is what
# fails when a merge leaves main not building (AGENTS.md "Commits, releases, and
# merging").
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

# A pull request's newer push supersedes its older one. A push to main is never
# cancelled or replaced while it waits, since each is a commit of the base history
# whose own figures and status name the pull request it merged: its group is its
# commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NX_BASE: ${{ github.event.pull_request.base.sha }}
  NX_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:

  test-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # From the hosted durations of what this job absorbs (`gate` 5,239-7,167 s on
    # recent base-tree runs, plus the wheel, install and smoke it now overlaps) and a
    # first run's cold build, with about a quarter's headroom; see the change that
    # set it for the run it was confirmed on.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which processor this runner has (demonstration)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E '^(Model name|CPU\(s\)):' ;;
            macOS) sysctl -n machdep.cpu.brand_string hw.ncpu ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; [Environment]::ProcessorCount" ;;
          esac
      - name: Decide cache trust and configure the sidecar
        id: nx-cache-trust
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/nx-remote-cache.mjs trust
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: op-nx/github-cache/start-cache-server@91839c24885842cac86567c30e23b37fb85f7e33
        id: nx-cache
        background: true
        with:
          port: '3000'
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
          CACHE_READ_ONLY: ${{ steps.nx-cache-trust.outputs.read_only == 'true' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Wait for the cache recording proxy
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
        run: node scripts/nx-remote-cache.mjs ready
      - name: The smoke's credential and scratch repository are present
        env:
          HAS_CREDENTIAL: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
          HAS_SMOKE_REPO: ${{ secrets.ONEPIPELINE_SMOKE_REPO != '' }}
        run: |
          if [ "$HAS_CREDENTIAL" != "true" ]; then
            echo "::error::the real-everything smoke needs the RELEASE_PLZ_TOKEN secret, passed as GH_TOKEN. This job never skips it and never falls back to a fake." >&2
            exit 1
          fi
          if [ "$HAS_SMOKE_REPO" != "true" ]; then
            echo "::error::the real-everything smoke needs the ONEPIPELINE_SMOKE_REPO secret: the scratch repository it publishes to, as owner/name with a name ending in -smoke." >&2
            exit 1
          fi
      - name: Read the exact CI tool versions
        id: ci-tools
        run: node .github/read-ci-tool-versions.mjs >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-linux
          save-if: false
      # The MSRV floor's check, here rather than in `lint`: a second toolchain's
      # whole-workspace build, which in `lint` shared the runner with the
      # visual-docs capture's and left it no headroom under 30 minutes. After
      # rust-cache, so the key stays the one main's warm run saves.
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::Cargo.toml declares no rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci-tools.outputs.node }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.ci-tools.outputs.linux_tools }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.ci-tools.outputs.python }}
      # A fork's run writes nothing to any cache: this action saves its own otherwise.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.ci-tools.outputs.uv }}
          enable-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      # The released tools `just bootstrap` compiles — two into `target/tools`,
      # the pool pruner onto cargo's PATH — keyed on the versions the justfile
      # pins and the toolchain that compiles them.
      - name: What the bootstrap tools are built from
        id: pins
        run: echo "tools=$(just --evaluate onetaskgraph-version)-$(just --evaluate onebudgetspec-version)-$(just --evaluate prune-superseded-version)" >> "$GITHUB_OUTPUT"
      - name: Restore the bootstrap tools
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tools
            ~/.cargo/bin/cargo-prune-superseded*
          key: bootstrap-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.tools }}-${{ hashFiles('rust-toolchain.toml') }}
      # Also provisions `strace` and the unprivileged user namespace, which the
      # Linux-only e2e journeys refuse without.
      - name: Bootstrap
        run: just bootstrap
      # Teed for the re-run step below (`shell: bash` is pipefail, so the tee
      # cannot turn a failed run green); the archive is the instrumented test
      # build, kept for that step to re-run without compiling.
      # llmlint: ignore-block[external_service_suite_stays_out_of_the_affected_tier, live_tier_compiles_and_requires_credential] the
      # pinned-wheel channel journeys have no credential to require — what they reach
      # is PyPI's public copy of one pinned wheel, read anonymously — and resolve uv
      # and the wheel first, failing naming whichever is missing. The credentialled
      # smoke is placed in `test-linux` by the plan that made these four jobs, and it
      # stays what it was: `onepipeline-real-smoke`'s own uncached `smoke` target,
      # reached by no `check`, its credential required above, selected by the same
      # affected answer as the rest of this job.
      - name: Tiers, MSRV, smoke, pinned-wheel journeys, install proofs and wheel (affected projects)
        id: gate
        env:
          ONEPIPELINE_TEST_PROFILE_SPANS: "1"
          ONEPIPELINE_DEMO_SPAWN_LOG_DIR: ${{ github.workspace }}/target/demo/spawns-tier
          NEXTEST_NO_FAIL_FAST: "1"
          # llmlint: ignore-block[least_privilege_grants] the live smoke's PAT:
          # the journey pushes to, opens a pull request on and merges in a scratch
          # repository the default token cannot reach.
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # llmlint: ignore-end[least_privilege_grants]
          ONEPIPELINE_SMOKE_REPO: ${{ secrets.ONEPIPELINE_SMOKE_REPO }}
          # The human-items fixture is restored from the artifact a push to main saved, and
          # generated where there is none; this job saves nothing (`github-store.sh`).
          HUMAN_ITEMS_FIXTURE_STORE: ${{ github.workspace }}/tests/human_items/github-store.sh
        run: ONEPIPELINE_TEST_ARCHIVE="$RUNNER_TEMP/tests.tar.zst" just ci-test-linux 2>&1 | tee "$RUNNER_TEMP/quality-gate.log"
      # llmlint: ignore-end[external_service_suite_stays_out_of_the_affected_tier, live_tier_compiles_and_requires_credential]
      - name: Keep the per-test profile records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-profile-test-linux
          path: target/test-profile/
          if-no-files-found: warn
          retention-days: 30
      - name: Measure the sample alone, one test at a time (demonstration)
        if: always()
        continue-on-error: true
        timeout-minutes: 75
        env:
          ONEPIPELINE_TEST_PROFILE_SPANS: "1"
          NEXTEST_TEST_THREADS: "1"
          ONEPIPELINE_DEMO_SPAWN_LOG_DIR: ${{ github.workspace }}/target/demo/spawns-alone
        run: bash .github/demo/sample-alone.sh coverage
      - name: Time the process-start floor (demonstration)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/demo/floor.sh
      - name: Keep the demonstration's records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-profile-linux
          path: target/demo/
          if-no-files-found: warn
          retention-days: 7
      # What each `budgets` check this run selected saved, for the `budgets` job's report. A failed
      # job's results still arrive, and a target this run did not select saved nothing.
      - name: Keep the saved budget results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-check-results-test-linux
          path: target/budget-results/
          if-no-files-found: warn
      - name: Does each failed test fail again on this build
        if: failure() && steps.gate.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 25
        env:
          # llmlint: ignore-block[least_privilege_grants] the gate step's own
          # values, no wider: a failed live-smoke journey re-run here does what it
          # did there, in a scratch repository the default token cannot reach.
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # llmlint: ignore-end[least_privilege_grants]
          ONEPIPELINE_SMOKE_REPO: ${{ secrets.ONEPIPELINE_SMOKE_REPO }}
          # llmlint: ignore-block[external_service_suite_stays_out_of_the_affected_tier] a re-run
          # of the human-items counting journey restores its fixture as the gate did; the store is
          # a cache it can do without, generating the fixture when a fetch is absent or unanswered.
          HUMAN_ITEMS_FIXTURE_STORE: ${{ github.workspace }}/tests/human_items/github-store.sh
          # llmlint: ignore-end[external_service_suite_stays_out_of_the_affected_tier]
        run: just rerun-failed-coverage "$RUNNER_TEMP/quality-gate.log" "$RUNNER_TEMP/tests.tar.zst"
      - name: Report cache entries and task executions
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: node scripts/nx-remote-cache.mjs report --job "$GITHUB_JOB" --out "$RUNNER_TEMP/nx-cache-report"
      - uses: actions/upload-artifact@v4
        if: always() && steps.nx-cache-trust.outputs.promotable == 'true'
        with:
          name: nx-cache-entries-${{ github.job }}
          path: ${{ runner.temp }}/nx-cache-report
          retention-days: 7
      - cancel: nx-cache
