name: CI

# Pull requests, and a push to main for two jobs: `budgets`, which records that
# commit's results as the history pull requests compare with, and `timed`, which
# times the release binary and checks every budget labelled `not-measured-on-pr`
# that a project's `timed` target owns, so a figure over its threshold is a red
# status on the one squash-merged pull request that commit is. No push to main
# re-runs the four pull-request jobs: branch protection does not require a branch
# to be up to date, and `rust-cache-warm.yml`'s build on each push to main is what
# fails when a merge leaves main not building (AGENTS.md "Commits, releases, and
# merging").
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

# A pull request's newer push supersedes its older one. A push to main is never
# cancelled or replaced while it waits, since each is a commit of the base history
# whose own figures and status name the pull request it merged: its group is its
# commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NX_BASE: ${{ github.event.pull_request.base.sha }}
  NX_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  # Demonstration only: every other job trimmed, and `timed` widened to this pull request for one run.
  # The timing budgets, on every push to main and on no pull request: `just ci-timed`
  # runs each affected project's `timed` target (`scripts/ci-job.sh timed` is the one
  # list), which builds and times a release binary, then checks the budgets it owns from
  # the record it wrote. A figure over its threshold fails this job, and an `::error`
  # annotation names the budget, the figure and the threshold. A pull request measures
  # none of these budgets (each is labelled `not-measured-on-pr`); it counts what the
  # binary does instead, in `test-linux`. Beside the timings, and never during one, it
  # runs README's documented install, which installs main itself, on every push that
  # affects the crate. Restores `test-linux`'s Rust cache and bootstraps as that job
  # does, saving nothing.
  timed:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The human-items fixture's artifacts, listed and downloaded by `github-store.sh`.
      actions: read
    defaults:
      run:
        shell: bash
    env:
      ONEPIPELINE_NX_BASE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit before the push, for affected selection.
          fetch-depth: 0
      - name: Read the exact CI tool versions
        id: ci-tools
        run: node .github/read-ci-tool-versions.mjs >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-linux
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci-tools.outputs.node }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.ci-tools.outputs.linux_tools }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.ci-tools.outputs.python }}
      # A fork's run writes nothing to any cache: this action saves its own otherwise.
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.ci-tools.outputs.uv }}
          enable-cache: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - name: What the bootstrap tools are built from
        id: pins
        run: echo "tools=$(just --evaluate onetaskgraph-version)-$(just --evaluate onebudgetspec-version)-$(just --evaluate prune-superseded-version)" >> "$GITHUB_OUTPUT"
      - name: Restore the bootstrap tools
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tools
            ~/.cargo/bin/cargo-prune-superseded*
          key: bootstrap-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.tools }}-${{ hashFiles('rust-toolchain.toml') }}
      # Also provisions `strace`, which the journeys' counted calls run under.
      - name: Bootstrap
        run: just bootstrap
      - name: Timing budgets and the documented install (affected projects)
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN_ITEMS_FIXTURE_STORE: ${{ github.workspace }}/tests/human_items/github-store.sh
          HUMAN_ITEMS_FIXTURE_SAVE_DIR: ${{ runner.temp }}/human-items-fixture
        run: just ci-timed
      # A human-items fixture this push generated, because no artifact held its key, kept as
      # the artifact every later run restores; a fixture restored is not saved again.
      - name: Name the human-items fixture this push generated
        id: human-items-fixture
        if: always()
        run: |
          staged="$RUNNER_TEMP/human-items-fixture/name"
          [ ! -f "$staged" ] || echo "name=$(cat "$staged")" >> "$GITHUB_OUTPUT"
      - name: Save the human-items fixture this push generated
        if: always() && steps.human-items-fixture.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.human-items-fixture.outputs.name }}
          path: ${{ runner.temp }}/human-items-fixture/${{ steps.human-items-fixture.outputs.name }}.tar.gz
          # Already gzipped by the fixture; the repository's longest retention.
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      # What each `timed` target checked, kept whatever it measured.
      - name: Keep the saved budget results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-check-results-timed
          path: target/budget-results/
          if-no-files-found: warn
