# A throwaway compile-cost demonstration (scripts/crate-split/demo-commit.mjs): it
# builds the CI tiers' test archive on each platform and times it. It writes no cache.
name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    env:
      NEXTEST_PROFILE: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the exact CI tool versions
        id: ci-tools
        run: node .github/read-ci-tool-versions.mjs >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-linux
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci-tools.outputs.node }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.ci-tools.outputs.linux_tools }}
      - name: The tree this run measures
        working-directory: ${{ github.workspace }}
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA head=${{ github.event.pull_request.head.sha }} tree=$(git rev-parse 'HEAD^{tree}')"
          echo "workflow blob=$(git rev-parse HEAD:.github/workflows/ci.yml)"
          echo "runner=$RUNNER_OS/$RUNNER_ARCH cpus=$(node -p 'require("os").cpus().length')"
      - name: Build the coverage test archive, timed
        working-directory: ${{ github.workspace }}
        run: node scripts/crate-split/measure-archive.mjs coverage

  measure-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    env:
      NEXTEST_PROFILE: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the exact CI tool versions
        id: ci-tools
        run: node .github/read-ci-tool-versions.mjs >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-macos
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci-tools.outputs.node }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.ci-tools.outputs.quick_tools }}
      - name: The tree this run measures
        working-directory: ${{ github.workspace }}
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA head=${{ github.event.pull_request.head.sha }} tree=$(git rev-parse 'HEAD^{tree}')"
          echo "workflow blob=$(git rev-parse HEAD:.github/workflows/ci.yml)"
          echo "runner=$RUNNER_OS/$RUNNER_ARCH cpus=$(node -p 'require("os").cpus().length')"
      - name: Build the quick test archive, timed
        working-directory: ${{ github.workspace }}
        run: node scripts/crate-split/measure-archive.mjs quick

  measure-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    env:
      NEXTEST_PROFILE: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the exact CI tool versions
        id: ci-tools
        run: node .github/read-ci-tool-versions.mjs >> "$GITHUB_OUTPUT"
      - uses: samypr100/setup-dev-drive@v3
        with:
          drive-size: 60GB
          drive-format: ReFS
          drive-type: Dynamic
          trusted-dev-drive: true
          workspace-copy: true
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp
      - name: Keep Defender's real-time scan off the build
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:DEV_DRIVE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-windows
          save-if: false
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }} -> target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.ci-tools.outputs.node }}
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.ci-tools.outputs.quick_tools }}
      - name: The tree this run measures
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA head=${{ github.event.pull_request.head.sha }} tree=$(git rev-parse 'HEAD^{tree}')"
          echo "workflow blob=$(git rev-parse HEAD:.github/workflows/ci.yml)"
          echo "runner=$RUNNER_OS/$RUNNER_ARCH cpus=$(node -p 'require("os").cpus().length')"
      - name: Build the quick test archive, timed
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: node scripts/crate-split/measure-archive.mjs quick
