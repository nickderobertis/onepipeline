name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which projects this pull request's diff can reach, derived once so every
  # Rust-artifact job below can skip on a packaging-only change instead of paying
  # the full matrix. On a push to main it answers `true` for everything.
  #
  # `nx-affected.sh` fails closed: with no derivable merge base — a shallow
  # clone, a missing base branch — it says the crate is affected and the matrices
  # run. Affected selection is a speed optimisation, and one that can silently
  # skip a check is a correctness hole.
  changes:
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.affected.outputs.crate }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `nx affected` needs the merge base, which a shallow checkout does not
          # have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Which projects the diff reaches
        id: affected
        run: echo "crate=$(bash scripts/nx-affected.sh --affects onepipeline)" >> "$GITHUB_OUTPUT"

  # The full gate on a clean checkout: bootstrap from scratch, then the
  # deterministic gate (format, clippy, tests incl. the contract and binary e2e
  # with the coverage threshold, docs) over every project. A pull request runs it
  # over the affected projects only; main runs the whole graph, so nothing
  # affected-detection or a stale cache could miss survives past the merge.
  #
  # Linux-only because coverage is measured here; macOS/Windows prove the
  # artifact via the `cross` job below.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-llvm-cov
      - name: Bootstrap
        run: just bootstrap
      - name: Quality gate (affected projects)
        if: github.event_name == 'pull_request'
        run: just check-affected
      - name: Quality gate (every project)
        if: github.event_name != 'pull_request'
        run: just check
      # A committed lockfile that `just bootstrap`/`just check` had to change is
      # a stale generated file; fail rather than let it drift.
      - name: Committed generated files are up to date
        run: git diff --exit-code -- Cargo.lock package-lock.json

  # llmlint: ignore-block[comments_earn_their_place] run 32538759791 and the `main`
  # timings below are why this job has the shape it has. The leg that burned 237
  # minutes naming no test is what the two limits and the per-test reporting were
  # added to end, and the sampled ranges are what say 45 and 60 are over twice a
  # green leg's worst rather than numbers somebody picked. Neither is recoverable
  # from the keys beneath them, and without them a reader cannot tell a bound that
  # was measured from one that was guessed.
  # Prove the artifact builds and its tests pass on macOS and Windows (without
  # the coverage threshold, which is enforced on Linux).
  #
  # Bounded, and diagnostic when it is not green — run 32538759791's
  # `cross (windows-latest)` leg was neither, and produced no test name in 237
  # minutes.
  #
  # `NEXTEST_PROFILE` is the line that selects the reporting: `just check-cross`
  # reaches the suite through `just test-quick`, which names no profile, so the
  # environment is what picks one and `.config/nextest.toml`'s `ci` profile is
  # what reports a line per test. Whatever cuts the leg short, the last line then
  # names where it got to.
  #
  # Two limits, because they buy different things. The step's is what bounds the
  # hang, and it is the step's rather than only the job's so that a timeout leaves
  # the job alive for the step below to say what was still running. Both exist
  # because nickderobertis/onepipeline#99 found no job here declaring one, so a
  # stuck leg burned toward GitHub's 360-minute default; 60 is still a sixth of it.
  #
  # They are sized off what the step spends its time on, which run 33315537691's
  # Windows leg reports: `Summary [929.332s]` inside a 17m0s step, and 3637.6s of
  # that 3714.7s of test time is the `e2e` binary, running four at a time on the
  # runner's four cores. So the step is *working*, not hanging, and its wall time
  # is the e2e suite's total over a core count that does not grow with the suite —
  # each e2e test added costs this leg another ~1.9s.
  #
  # Which is how 20 stopped bounding the hang and started bounding the work. Over
  # the twelve `main` runs to 2026-08-30 the Windows step took 11m54s-17m06s when
  # green (its job 17m18s-22m06s), and run 33338370989 was cut at test 915 of 981.
  # The four legs of nickderobertis/onepipeline#167 and #168 were each cut at
  # 92-94% of ~1000 tests, 16m36s into a test phase needing ~17m40s: a step that
  # needs 21-22m. 45 and 60 are over twice both that and the worst green run —
  # the ratio 20 and 30 held back when the step was 8m00s and the job 12m38s.
  # macOS is unmoved by them and far inside: 9m24s-12m06s step, 11m54s-15m48s job.
  #
  # Splitting the suite across more jobs is the only thing that would make the leg
  # itself shorter, and it is not available: branch protection requires `cross
  # (macos-latest)` and `cross (windows-latest)` by rendered name, so a shard axis
  # renames both and every open pull request waits on a context that never reports.
  # llmlint: ignore-end[comments_earn_their_place]
  cross:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEXTEST_PROFILE: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - name: Bootstrap
        run: just bootstrap
      - name: Quality gate (cross-platform legs)
        timeout-minutes: 45
        run: just check-cross
      # A leg that stops without a verdict stops holding something — a test
      # process, or a child of one that outlived it — and on Windows there are no
      # process groups to make that visible afterwards, so it is read here while
      # it is still true.
      - name: What was still running when it stopped
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,CommandLine | Format-Table -AutoSize -Wrap" \
              || tasklist /v
          else
            ps -ef
          fi

  # The declared MSRV is a promise to consumers, so prove it rather than document
  # it: a floor that only lives in Cargo.toml drifts the first time a dependency
  # raises its own.
  msrv:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      # `just msrv` reads the same `rust-version` field, so the recipe and the
      # job can never disagree about which floor was proven.
      - run: just msrv

  # The one tier that is not offline: the real `onevcs`, real git against a real
  # remote, and the real GitHub API opening and merging a pull request on a
  # scratch repository. Every other job here would pass against a sibling that
  # refuses every invocation — R0 did — so this is the job that proves the
  # composition against the world.
  #
  # It calls `just smoke-real`, which is the same entry point a person runs
  # locally: the journey is defined once, in the test binary, and never
  # reimplemented as workflow steps. The credential is named rather than
  # embedded, and the journey refuses loudly rather than skipping when it is
  # absent — a smoke that can pass without talking to GitHub proves nothing.
  smoke:
    needs: changes
    if: needs.changes.outputs.crate == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      # The journey's own refusal names GH_TOKEN, the variable; a red job needs
      # the name of the secret to go set. Given a presence signal rather than the
      # PAT itself — nothing here needs the value.
      # The store every plan in the suite is read out of. This job does not run
      # `just bootstrap` — it needs none of the rest of it — so it provisions the
      # one binary the journeys cannot run without, through the same recipe.
      - name: The onetaskgraph every plan is read through
        run: just _ensure-onetaskgraph
      - name: The smoke's credential is present
        env:
          HAS_CREDENTIAL: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
        run: |
          if [ "$HAS_CREDENTIAL" != "true" ]; then
            echo "::error::the real-everything smoke needs the RELEASE_PLZ_TOKEN secret, passed as GH_TOKEN. Set it to a PAT that can push to, open a pull request on, and merge in the scratch repository. This job never skips and never falls back to a fake." >&2
            exit 1
          fi
      - name: Real onevcs, real git, real GitHub
        run: just smoke-real
        env:
          # llmlint: ignore-block[least_privilege_grants] this grant is wider than
          # the job needs, and that is the operator's deliberate call rather than an
          # oversight. The default GITHUB_TOKEN cannot do the work — it is scoped to
          # the repository the workflow runs in and this job publishes to another —
          # so the credential has to be a PAT, and the decision is that it is the one
          # this repository already provisions rather than a second, scratch-only
          # secret to keep alive. The residual exposure is that a job running a pull
          # request's own code holds a token that can cut a release; it is accepted,
          # because this is a single-owner repository with no external contributors,
          # and GitHub withholds secrets from fork-originated `pull_request` runs in
          # any case. Absent, this job fails naming the secret — which is the
          # intended behaviour, because the alternative is a smoke that passes
          # without talking to GitHub.
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # llmlint: ignore-end[least_privilege_grants]
          # No ONEPIPELINE_SMOKE_REPO: the journey's own default is the scratch
          # repository, and naming it here again would be a second place for it
          # to be wrong. Set it only to point a run somewhere else.

  # Advisory + license audit and unused-dependency check. Its own Linux-only job:
  # it needs a network advisory DB and must not be duplicated across the matrix.
  deny:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete
      - run: just deps-check

  # Prove the end-user install path on every platform: install the binary the
  # documented way and smoke-test the real artifact through scripts/
  # smoke-published.sh — the same assertions the post-publish verify jobs run
  # against PyPI and npm, so what a release checks cannot drift from what a pull
  # request checks. `cargo install --path .` is the same code path as the
  # documented `cargo install onepipeline`, minus the registry fetch.
  install:
    needs: [changes, gate]
    if: needs.changes.outputs.crate == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # On a PR the change is not on the registry yet, so `--path .` is the only
      # way to install *this* revision.
      - name: Install (this revision)
        run: cargo install --path . --locked
      - name: Smoke-test the installed binary
        run: bash scripts/smoke-published.sh --label "cargo install on $RUNNER_OS/$RUNNER_ARCH"

  # The README's from-source one-liner, read out of README.md and run verbatim.
  # The command is not spelled again here: the README is its one source, so this
  # job cannot end up proving a command nobody is told to type.
  #
  # It runs on pull requests too, and is required. What it resolves is still the
  # remote's default branch rather than the branch under review — inherent to a
  # `--git` install with no revision, and the `install` job above is what proves
  # this revision — but a check that can only report after the merge gates
  # nothing, which is how the documented command stayed broken through a release.
  install-documented:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # For README.md and scripts/smoke-published.sh. The install itself resolves
      # everything it builds from the remote, which is the point.
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install (the command the README gives users)
        run: |
          documented=$(grep -m1 '^cargo install --git ' README.md || true)
          if [[ -z $documented ]]; then
            echo "README.md's Install section no longer gives a 'cargo install --git' one-liner, so there is nothing for this job to prove — restore it or drop this job" >&2
            exit 1
          fi
          # README.md is committed, but it is still file-derived input: accept
          # only a plain argv of unambiguous characters, then run it as an argv.
          # Nothing in that file is ever handed to the shell to interpret.
          if [[ $documented =~ [^A-Za-z0-9._:/@=+[:space:]-] ]]; then
            echo "README.md's install one-liner carries characters this job will not run: $documented" >&2
            exit 1
          fi
          read -r -a argv <<<"$documented"
          echo "running README.md's command: ${argv[*]}"
          "${argv[@]}"
      - name: Smoke-test the installed binary
        run: bash scripts/smoke-published.sh --label "cargo install --git on $RUNNER_OS/$RUNNER_ARCH"

  # The other end-user install path: the maturin wheel `pip install
  # onepipeline-cli` serves. Built and installed from this revision so the
  # packaging is proven on every pull request rather than first at a release,
  # where a broken wheel is already public.
  wheel:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist
          maturin-version: v1.14.1
      - name: Install it and smoke-test what it put on PATH
        run: |
          pip install --no-index --find-links dist onepipeline-cli
          bash scripts/smoke-published.sh --label "the wheel built from this revision"

  # Lint the PR title: under squash-merge it becomes the release-driving commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The LLM-judge tier: a blocking PR check, separate from the deterministic
  # `check` gate. It requires its harness credential and fails fast without it —
  # a credential-less no-op would report unlinted files as clean. Fork PRs are
  # gated by the repo's require-approval-for-fork-workflows setting.
  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-just
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # oneharness.toml's primary harness. Without a harness binary on PATH,
      # llmlint has nothing to drive and the job would fail with no findings —
      # which reads like a clean run. Pinned rather than floating: an upstream
      # release has taken this required check down for every pull request before.
      - name: Install the Codex harness
        run: npm install -g @openai/codex@0.145.0
      # oneharness only falls through to a harness it can actually spawn, so the
      # secondary in the chain is a resilience claim the runner cannot honour
      # unless `claude` is on PATH too.
      - name: Install the Claude Code harness (oneharness fallback)
        run: npm install -g @anthropic-ai/claude-code@2.1.220
      - name: Install llmlint toolchain
        run: just setup-llmlint
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          # The fallback is only real if its credential arrived too: without it
          # claude-code is rejected at auth and falls through, leaving the chain
          # nowhere to degrade to — silently, because an installed-yet-
          # uncredentialled harness looks fine.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs CLAUDE_CODE_OAUTH_TOKEN for the claude-code fallback harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main
