name: Release-plz

# Conventional-commit release automation. On every push to main, one job:
#   * guard       — without the RELEASE_PLZ_TOKEN secret, every later step is
#                   skipped and the job says how to enable it.
#   * release     — if a merged version-bump PR left Cargo.toml at a version with
#                   no tag yet, tag vX.Y.Z and cut the GitHub Release.
#   * release-pr  — open/update a "release vX.Y.Z" PR that bumps the version and
#                   writes the CHANGELOG for the commits since the last release.
#   * auto-merge  — ask GitHub to merge that PR automatically once its required
#                   checks pass; the merge re-triggers `release` above. A refused
#                   request fails the job rather than leaving the PR waiting.
#
# The Release release-plz cuts (via the PAT) fires the `release: published` event
# that drives release.yml to build and publish every artifact — so merging a PR
# is the only human action in a release.
#
# RELEASE_PLZ_TOKEN is a PAT, not the default GITHUB_TOKEN: a tag/release created
# by GITHUB_TOKEN does NOT trigger other workflows, so release.yml would never
# build anything and the release would silently ship nothing. The PAT needs
# `contents: write` + `pull-requests: write`.
#
# release-plz does not publish to crates.io here (`publish = false` in
# release-plz.toml), so it has no registry baseline to compute the next version
# from; `--registry-manifest-path` points it at a checkout of the last release
# tag as the baseline, restoring conventional-commit versioning from git history.
#
# `tests/release_journeys/release-plz.journey.mjs` runs these steps, in this order and
# under these conditions, over a scratch repository.

on:
  push:
    branches: [main, 'cache-promote/**']

permissions:
  contents: read

env:
  # Pin release-plz so the release process is reproducible; bump deliberately.
  RELEASE_PLZ_VERSION: "0.3.158"

jobs:
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every write — the checkout's pushes, release-plz, auto-merge — authenticates
    # with RELEASE_PLZ_TOKEN, so the job's own token needs nothing more.
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      # `secrets` cannot be read in an `if:`, so the token's presence becomes an
      # output every later step is conditioned on.
      - name: Guard on the release token
        id: guard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE_PLZ_TOKEN not set; skipping release automation." >&2
            echo "Add a PAT (contents:write + pull-requests:write) as the repo" >&2
            echo "secret RELEASE_PLZ_TOKEN to enable conventional-commit releases." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - name: Decide cache trust and configure the sidecar
        id: nx-cache-trust
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/nx-remote-cache.mjs trust
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: op-nx/github-cache/start-cache-server@91839c24885842cac86567c30e23b37fb85f7e33
        id: nx-cache
        background: true
        with:
          port: '3000'
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
          CACHE_READ_ONLY: ${{ steps.nx-cache-trust.outputs.read_only == 'true' && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Wait for the cache recording proxy
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:3000
          NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ steps.nx-cache-trust.outputs.token }}
        run: node scripts/nx-remote-cache.mjs ready
      - name: Promote the merged pull request's cache entries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            pr="${GITHUB_REF_NAME##*/}"
            node scripts/nx-remote-cache.mjs promote --pr "$pr" --workflow ci.yml
          else
            node scripts/nx-remote-cache.mjs promote --sha "$GITHUB_SHA" --workflow ci.yml
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx-cache-promotion-${{ github.sha }}
          path: ${{ runner.temp }}/nx-cache-promotion
          retention-days: 7
      - cancel: nx-cache
        if: always()
        continue-on-error: true
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'

      # taiki-e/install-action verifies the downloaded archive's checksum before
      # unpacking it; a `curl | tar` pipeline would execute an unauthenticated
      # download.
      - uses: taiki-e/install-action@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        with:
          tool: release-plz@${{ env.RELEASE_PLZ_VERSION }},cargo-semver-checks

      # release-plz.toml is the one source for whether the API check runs; this
      # job only has to be able to honour it. Derived rather than assumed,
      # because release-plz shells out to cargo-semver-checks and off PATH the
      # check does not run — and does not say so.
      - name: The toolchain honours release-plz.toml's semver_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        run: |
          if grep -Eq '^[[:space:]]*semver_check[[:space:]]*=[[:space:]]*true' release-plz.toml \
             && ! command -v cargo-semver-checks >/dev/null; then
            echo "::error::release-plz.toml sets semver_check = true, but cargo-semver-checks is not on PATH — add it to the install-action tool list above or the API check silently will not run" >&2
            exit 1
          fi

      - name: Tag and publish a merged version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release --git-token "$GITHUB_TOKEN"

      # Compute the baseline AFTER `release` so it reflects the tag that step
      # just created. Computed earlier, `release-pr` would compare against the
      # *previous* tag, making the just-merged release commit look like new work
      # and opening yet another release PR — a self-sustaining release loop.
      - name: Use the latest release tag as the version baseline
        id: baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true'
        run: |
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [ -n "$tag" ]; then
            git worktree add --detach "${RUNNER_TEMP}/release-baseline" "$tag"
            echo "arg=--registry-manifest-path ${RUNNER_TEMP}/release-baseline/Cargo.toml" >> "$GITHUB_OUTPUT"
            echo "Baseline: $tag"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
            echo "No release tag yet; the first release uses the current version."
          fi

      # Belt to the baseline fix: never open/merge a release PR on a push that is
      # itself a merged release commit.
      # llmlint: ignore[changed_behavior_has_e2e] `release-pr` pushes a branch and opens a PR on the real forge, and the release-plz journey (tests/release_journeys/release-plz.journey.mjs) must write no remote, so it runs this step's own command line with `release-pr` mapped to release-plz's local `update`, which prepares the same bump and changelog; the auto-merge step after it is driven against the local forge.
      - name: Open or update the release PR
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true' && !startsWith(github.event.head_commit.message, 'chore: release') }}"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          BASELINE: ${{ steps.baseline.outputs.arg }}
        run: |
          # The baseline argument is two words, or none, so it is split on purpose.
          # shellcheck disable=SC2086
          release-plz release-pr $BASELINE --git-token "$GITHUB_TOKEN"

      - name: Merge the release PR automatically once its required checks pass
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guard.outputs.enabled == 'true' && !startsWith(github.event.head_commit.message, 'chore: release') }}"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: bash release/release-pr-auto-merge.sh
