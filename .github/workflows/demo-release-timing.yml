name: DO NOT MERGE release build timing

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  time:
    name: windows ${{ matrix.variant }} ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: [after, defender, devdrive]
        rep: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: samypr100/setup-dev-drive@v3
        if: matrix.variant == 'devdrive'
        with:
          drive-size: 60GB
          drive-format: ReFS
          drive-type: Dynamic
          trusted-dev-drive: true
          workspace-copy: true
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp
      - name: Where the build runs
        id: where
        run: echo "dir=${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
      - name: Keep Defender's real-time scan off the build
        if: matrix.variant != 'after'
        shell: pwsh
        run: |
          $paths = @("${{ steps.where.outputs.dir }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", $env:RUNNER_TEMP)
          if ($env:DEV_DRIVE) { $paths += $env:DEV_DRIVE; New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null }
          Add-MpPreference -ExclusionPath $paths
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          workspaces: ${{ steps.where.outputs.dir }} -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the packager and the Rust target
        working-directory: ${{ steps.where.outputs.dir }}
        run: |
          just nx run onepipeline-npm:bootstrap
          uv tool dir --bin >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-msvc
      - name: Build, package and test-install (dry-run)
        working-directory: ${{ steps.where.outputs.dir }}
        run: just release-windows dry-run
