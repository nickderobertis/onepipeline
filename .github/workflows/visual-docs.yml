# Terminal screenshots, through screencomp's reusable workflow. The capture step
# is ours; screencomp owns the classify gate, the gallery and the PR comment.
#
# Informational and **not a required check** — AGENTS.md says why, beside the two
# other workflows this repository keeps out of its required set.

name: Visual docs

# llmlint: ignore-block[changed_behavior_has_e2e] the two gh-pages behaviours these
# triggers reach — deleting a closed pull request's preview, and pruning the branch's
# history on a schedule — are screencomp's own, tested there; what this repository adds
# is two literal inputs. What they do is mutate a branch on GitHub from a scheduled
# runner, which no offline journey in this repository can observe and no journey should
# arrange, and the alternative to configuring them is an unbounded branch of committed
# images. `screencomp doctor --env` is what checks this call is wired correctly here.
on:
  pull_request:
    # `closed` lets screencomp delete this PR's gh-pages preview once it closes,
    # so stale /pr-<n>/ galleries do not accumulate on the branch.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    # Monthly: prune the gh-pages gallery history so committed images do not
    # grow the branch without bound (keeps the 20 most recent versions).
    - cron: "19 5 1 * *"
# llmlint: ignore-end[changed_behavior_has_e2e]

jobs:
  visual-docs:
    # llmlint: ignore-block[least_privilege_grants] granted on the job rather than the
    # workflow, and neither can be narrowed further by event here: `permissions` values
    # are literals — GitHub accepts no expression in them — and a reusable-workflow call
    # takes its permissions from the calling job. A `pull_request`-only
    # `pull-requests: write` therefore means a *second job* duplicating this whole `with:`
    # block; that duplicate drifts, and it renames the check this workflow reports, which
    # is the context branch protection is meant to require.
    permissions:
      contents: write       # push the gh-pages gallery
      pull-requests: write  # post the sticky diff comment on a pull request
    # llmlint: ignore-end[least_privilege_grants]
    # The next two lines name one screencomp release twice — GitHub resolves a
    # reusable workflow by ref and the workflow installs the CLI by version, and
    # neither can be derived from the other in YAML. `screenshots/capture.py`
    # reconciles them: it reads both out of this file and refuses the capture
    # when they have parted, so the drift fails the guard and this workflow
    # rather than producing a gallery from one release and a gate from another.
    uses: nickderobertis/screencomp/.github/workflows/visual-docs-reusable.yml@v0.4.8
    with:
      screencomp-version: v0.4.8
      # Strict: this FAILS when the capture drifts from the committed baseline
      # (shots/baseline/<arch>.json). Regenerate it with `just screenshots-bless`
      # — the pre-push guard does it for you — and commit it with the images.
      fail-on-drift: true
      # Keep the gh-pages gallery bounded: delete this PR's preview on close and
      # prune history on the monthly schedule above.
      gh-pages-maintenance: true
      gh-pages-history-versions: 20
      # The capture-command runs INSIDE this container (the reusable workflow's
      # default is a Playwright image for web apps). This one has to build the
      # release binaries it drives, so it is a Rust image. The tag is the major
      # line only, deliberately: what the *capture* is pinned to is the renderer
      # and the font, and the compiler cannot change a line of text a verb
      # prints. The exact toolchain the build uses is still this repository's
      # one source for it — rust-toolchain.toml, read below — so nothing here
      # restates a version.
      container: rust:1-bookworm
      # Three derivations and no restatements. The toolchain comes from
      # rust-toolchain.toml's own `channel`; `freeze` comes from the justfile's
      # `freeze-version` line, read by the script, because the renderer's
      # version decides the bytes of every shot; and `onetaskgraph` comes from
      # the justfile's `onetaskgraph-version`, which `src/taskgraph.rs` holds to
      # being named exactly once. The capture reads its plan through that real
      # binary, exactly as the e2e suite does.
      #
      # The reusable workflow exports $SHOTS_OUT as shots/current/<arch>;
      # screenshots/capture.sh writes captures.json and the SVGs there.
      capture-command: |
        RUSTUP_TOOLCHAIN="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        # One channel, or none: read leniently, an empty value silently builds with the
        # image's own toolchain and a two-line one exports a string rustup cannot resolve.
        if [ "$(printf '%s' "$RUSTUP_TOOLCHAIN" | wc -l)" -ne 0 ] || [ -z "$RUSTUP_TOOLCHAIN" ]; then
          echo "rust-toolchain.toml does not name exactly one channel: '$RUSTUP_TOOLCHAIN'" >&2
          exit 1
        fi
        export RUSTUP_TOOLCHAIN
        # llmlint: ignore[work_goes_through_command_surface] this container is a bare `rust:1-bookworm` with no `just`; this is the body of `just screenshots-tools`, which additionally needs Go, and it reads the same `freeze-version` line that recipe does
        bash screenshots/install-freeze.sh
        # llmlint: ignore[work_goes_through_command_surface, diagnostics_error_or_absent] the body of `_ensure-onetaskgraph`, reading the same `onetaskgraph-version` line; `just bootstrap` is the recipe that owns it and additionally installs rustup components, cargo-nextest, cargo-llvm-cov and strace, none of which a capture uses, through Nx, which this container has no Node for. Its diagnostics are a published sibling's own: `-D warnings` over another crate's source fails this capture on a warning nobody here can fix, and that crate's own gate is where they are answered
        store="$(sed -n 's/^onetaskgraph-version *:= *"\([^"]*\)".*/\1/p' justfile)"
        echo "$store" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || {
          echo "the justfile does not name exactly one onetaskgraph release: '$store'" >&2
          exit 1
        }
        cargo install onetaskgraph --locked --version "$store"
        # llmlint: ignore[work_goes_through_command_surface] no `just` in this container; `just screenshots` wraps exactly this line
        bash screenshots/capture.sh
