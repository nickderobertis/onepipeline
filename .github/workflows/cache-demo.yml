# A throwaway on a draft whose branch disables ci.yml: builds each altered warm leg from
# cold and measures the archive it would save. It restores no Rust copy and saves nothing:
# a trial copy would itself push the repository over its allowance and evict results.
name: Cache demo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: What the bootstrap tools are built from
        id: pins
        run: echo "tools=$(just --evaluate onetaskgraph-version)-$(just --evaluate onebudgetspec-version)-$(just --evaluate prune-superseded-version)" >> "$GITHUB_OUTPUT"
      - name: Restore the bootstrap tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            target/tools
            ~/.cargo/bin/cargo-prune-superseded*
          key: bootstrap-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.tools }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install the bootstrap tools
        run: just _ensure-onetaskgraph _ensure-onebudgetspec _ensure-prune-superseded
      - name: Build what lint's visual docs capture builds
        env:
          SHOTS_OUT: shots/current/x86_64
        run: bash screenshots/ci-capture.sh
      - name: The capture's archive, and its build again
        run: node scripts/cache-demo/measure.mjs capture-archive
