# DEMONSTRATION BRANCH ONLY — never merged. Attempt 4: the new tests on both
# cross-platform runners, under CI's colour and profile, with rust-cache's post
# step to show the fixtures no longer sit in the tree it cleans.
name: DEMO nextest_runs on both cross runners

on: pull_request

permissions:
  contents: read

jobs:
  nextest-runs:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEXTEST_PROFILE: ci
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: The new tests, as the suite runs them
        run: cargo nextest run --locked -E 'binary(nextest_runs) and not test(demonstration)'
