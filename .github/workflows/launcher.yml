name: npm launcher

# What the npm-installed `onepipeline` runs as on Windows, where the engine runs
# under a keeper with the console's interrupts and an orphan's cleanup to get
# right. Linux runs the same journeys in `just check`, with the npm project's
# other tests; macOS and Windows run them in `ci.yml`'s `test-macos` and
# `test-windows` (`onepipeline-npm:test-launcher`), `test-macos` being the one Mac
# job a pull request may spend (`.github/tests/macos-policy.test.mjs`).
#
# **Advisory.** No branch protection requires it: making it required is a
# branch-protection change only the repository owner approves. It runs where
# the change reaches the `onepipeline-npm` project — the launcher and its
# packaging, or the engine it starts — selected the way `ci.yml` selects its
# matrices, and like them it fails closed to running.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.affected.outputs.npm }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `nx affected` needs the merge base, which a shallow checkout does not
          # have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Whether the diff reaches the npm distribution
        id: affected
        env:
          ONEPIPELINE_NX_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: echo "npm=$(bash scripts/nx-affected.sh --affects onepipeline-npm)" >> "$GITHUB_OUTPUT"

  launcher:
    name: npm launcher (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2.9.2
        # Restored on a pull request, saved only from main.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just npm-launcher
