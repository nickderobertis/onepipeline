# Build configuration every cargo invocation anywhere inside this clone reads.
#
# `target-dir` here is resolved relative to the directory holding `.cargo/`, so
# every crate in this clone — workspace members and any crate outside the
# workspace alike — builds into `<clone>/target`, and a second clone or worktree
# of this repository, carrying its own copy of this file, builds into its own
# root. Never point this outside the clone: concurrent worktrees must not share
# one target directory.
[build]
target-dir = "target"

# No debuginfo for dev and test builds (`test` inherits `dev`): cargo passes no
# `-C debuginfo` level and strips the standard library's. A panic still names its
# file:line (that location is compiled in, not read from debuginfo) and
# `cargo llvm-cov` measures through its own instrumentation, while every test
# binary drops the 2-3x of its size debuginfo was. `release` is untouched.
[profile.dev]
debug = 0

# Linux dev and test builds — `cargo build`, the nextest binaries, and the
# `cargo llvm-cov` builds under `target/llvm-cov-target` — link with the
# toolchain's bundled rust-lld instead of GNU `ld`, which `docs/gate-profile.md`
# measured spending ~14x rustc's CPU linking the test binaries. x86_64 already
# defaults to rust-lld; aarch64 and the rest do not, and stable rustc selects it
# only through unstable flags. It is a `linker` rather than `rustflags` because
# the `RUSTFLAGS` the `-D warnings` recipes and `cargo llvm-cov` set replace a
# config `rustflags` outright, and nothing replaces this. The script hands
# release output, and a toolchain without rust-lld, to plain `cc` unchanged.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
linker = "scripts/cc-lld-debug.sh"
